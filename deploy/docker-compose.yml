# 두잉 백엔드 운영 배포 — AWS Lightsail VM 단일 인스턴스.
# Caddy 가 api.duings.com 의 TLS 종단 + 리버스 프록시를 맡고, backend 는 내부 네트워크에서 8080 만 노출한다.
# 런타임 시크릿은 같은 디렉터리의 .env(커밋 금지 · backend/.env.example 참고)로 주입한다.
services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    # 비루트(Dockerfile)에 더해 권한 상승 차단 + 모든 리눅스 capability 제거(8080 바인딩은 cap 불필요).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    env_file:
      - .env
    expose:
      - "8080"           # 내부 네트워크에만 노출 — 호스트로 직접 게시하지 않는다(Caddy 경유).
    healthcheck:
      # docker compose ps에서 프로세스 생존 상태를 확인한다. 최초 전환 배포에서 구버전 이미지로
      # 롤백하면 새 경로가 없으므로, 정확히 404일 때만 기존 종합 health로 폴백한다.
      test:
        - CMD-SHELL
        - >-
          status=$$(curl --silent --output /dev/null --write-out '%{http_code}'
          --connect-timeout 2 --max-time 2
          http://localhost:8080/actuator/health/liveness);
          curl_exit=$$?;
          if [ "$$curl_exit" -ne 0 ]; then
            exit 1;
          elif [ "$$status" = "404" ]; then
            curl --fail --silent --show-error --connect-timeout 2 --max-time 2 http://localhost:8080/actuator/health > /dev/null;
          else
            [ "$$status" = "200" ];
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - duing

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 발급받은 TLS 인증서 영속화(재시작 시 재발급/레이트리밋 방지)
      - caddy_config:/config
    networks:
      - duing

networks:
  duing:

volumes:
  caddy_data:
  caddy_config:
