# 두잉 백엔드 운영 배포 — AWS Lightsail VM 단일 인스턴스.
# Caddy 가 api.duings.com 의 TLS 종단 + 리버스 프록시를 맡고, backend 는 내부 네트워크에서 8080 만 노출한다.
# 런타임 시크릿은 같은 디렉터리의 .env(커밋 금지 · backend/.env.example 참고)로 주입한다.
services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    # 메모리 상한 — 없으면 JVM 의 MaxRAMPercentage=75 가 호스트 전체 RAM(1.9GB 실측) 기준으로 힙을 잡아
    # Caddy·OS 몫을 침식하고, 호스트 OOM 킬러는 ExitOnOutOfMemoryError 가 막지 못한다. 1400m 이면 힙 상한 ≈1.05GB
    # (부하테스트 권고 -Xmx≈1GB 와 일치), 나머지 ~500MB 가 Caddy·OS 여유. 한도 초과 시 컨테이너만 재시작된다.
    mem_limit: 1400m
    # 비루트(Dockerfile)에 더해 권한 상승 차단 + 모든 리눅스 capability 제거(8080 바인딩은 cap 불필요).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # 컨테이너 로그 회전 — 기본 json-file 드라이버는 크기·보관 상한이 없어 디스크가 무한히 는다(#754).
    # 감사 기록의 원천은 club_audit_event·admin_user_action_log 이고, 이 로그는 단기 디버깅용 흔적일 뿐이다.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - .env
    expose:
      - "8080"           # 내부 네트워크에만 노출 — 호스트로 직접 게시하지 않는다(Caddy 경유).
    healthcheck:
      # 상태 가시화용(Docker 는 unhealthy 여도 자동 재시작하지 않는다). liveness(프로세스 생존)만 본다 —
      # aggregate health 는 db indicator 를 포함해 30초마다 DB 검증 쿼리(일 2,880회)를 만들었다.
      # DB 장애 감지는 Better Stack 1번(aggregate /actuator/health, deploy/UPTIME.md 분류표 ①)이 담당한다.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # 최초 배포 시 Flyway 마이그레이션 + 부팅 시간 확보
    networks:
      - duing

  caddy:
    # 버전 고정 — Caddy 는 버전마다 시간 상한 동작이 다르다(2026-10-07 실측). 2.11.4 는 HTTP/1.1·2 업로드 모두 read_body 에서
    # 끊기지만, 2.11.7 은 HTTP/1.1 본문에 read_body·read_body_idle 이 걸리지 않는다. 2.11.4 는 2.11.6 에서 생긴 read_body_idle
    # 옵션을 모른다. 떠다니는 2-alpine 이면 CI(최신)와 서버(받아 둔 옛 이미지)가 서로 다른 버전으로 검증·구동한다.
    # 올릴 때는 deploy-config-ci.yml·deploy-backend.yml 의 검증 이미지도 같은 태그로 바꾸고(어긋나면 deploy-config-ci 가 실패한다),
    # 로컬에서 시간 상한(특히 HTTP/1.1 느린 업로드)이 그대로인지 확인한다. 태그가 바뀌면 배포 때 caddy 컨테이너가 다시 만들어져 수 초 끊긴다.
    # 이 고정의 비용: 2.11.4 는 go1.26.3 빌드라 그 뒤 Go 보안 수정(GO-2026-6090 TLS KeyUpdate·GO-2026-6218 net/url, 둘 다
    # DoS 급, go1.26.6 수정)이 빠져 있다. 해제 조건: HTTP/1.1 reverse_proxy 본문에 read_body 가 다시 걸리는 릴리스가 나오면
    # 그 버전으로 올린다 — 올릴 때 HTTP/1.1·2 느린 업로드가 둘 다 끊기는지, 2.11.6 의 h2 패닉(#8101)이 고쳐졌는지 확인한다.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    # 평시 수십 MB 지만 1,000 동접에 +60MB, 1,500 동접이면 TLS 세션으로 수백 MB 까지 간다(부하테스트 실측).
    # 128m 이면 그 구간에서 Caddy 가 죽어 TLS 종단 전체가 내려가므로 256m. backend 1400 + 256 = 1656MB, OS 여유 ~250MB.
    mem_limit: 256m
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 발급받은 TLS 인증서 영속화(재시작 시 재발급/레이트리밋 방지)
      - caddy_config:/config
    networks:
      - duing

networks:
  duing:

volumes:
  caddy_data:
  caddy_config:
