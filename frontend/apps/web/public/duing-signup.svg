<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Pretendard, &#39;Apple SD Gothic Neo&#39;, &#39;Malgun Gothic&#39;, sans-serif">
  <defs>
    <clipPath id="phoneClip">
      <rect x="210" y="30" width="470" height="620" rx="40"></rect>
    </clipPath>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1F4A36" flood-opacity="0.16"></feDropShadow>
    </filter>
    <filter id="btnShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2E8B57" flood-opacity="0.4"></feDropShadow>
    </filter>
  </defs>

  
  <g>
    <rect x="210" y="30" width="470" height="620" rx="40" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="3"></rect>
    <g clip-path="url(#phoneClip)">
      <rect x="210" y="30" width="470" height="96" fill="#F0EDE5"></rect>
      <line x1="210" y1="126" x2="680" y2="126" stroke="#E5E2DA" stroke-width="1"></line>
      <text x="445" y="90" text-anchor="middle" font-size="21" font-weight="700" fill="#2F3433">새로운 메시지</text>
      <text x="238" y="178" font-size="18" fill="#6F7574">받는 사람 :
        <tspan fill="#1F4A36" font-weight="800" dx="4">1666-3538</tspan>
      </text>
    </g>
  </g>

  
  <g filter="url(#cardShadow)">
    <rect x="40" y="300" width="660" height="182" rx="26" fill="#FFFFFF"></rect>
  </g>
  <text x="76" y="350" font-size="25" font-weight="700">
    <tspan fill="#6F7574">[</tspan><tspan fill="#1F4A36">두잉</tspan><tspan fill="#6F7574">] 인증문자 보내기</tspan>
  </text>
  <text x="76" y="436" font-size="44" font-weight="700" fill="#2F3433" letter-spacing="7" font-family="&#39;JetBrains Mono&#39;, ui-monospace, Menlo, monospace">5WAVK4YZ</text>

  
  <circle cx="628" cy="391" r="42" fill="#E8EEE8"></circle>
  <circle cx="628" cy="391" r="30" fill="#2E8B57" filter="url(#btnShadow)"></circle>
  <path d="M628 406 V376 M614 390 l14 -14 l14 14" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>

  
  <g filter="url(#cardShadow)">
    <rect x="520" y="176" width="310" height="100" rx="18" fill="#1F4A36"></rect>
    <path d="M560 276 h32 l-16 22 z" fill="#1F4A36"></path>
  </g>
  <text x="675" y="214" text-anchor="middle" font-size="23" font-weight="500" fill="#FFFFFF">입력된 문자를 보내면</text>
