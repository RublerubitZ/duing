# Dependabot 버전 업데이트 — 월 1회, 생태계별 묶음 PR.
# 보안 업데이트는 저장소 설정(automated-security-fixes)으로 켠다. 아래 update-types 기반 ignore·cooldown·groups 는
# 보안 업데이트에 적용되지 않는다(ignore 에 versions 를 지정하면 보안 업데이트에도 적용되니 쓰지 않는다).
# 운영 규칙(squash 제목 한국어·90일 안에 처분·배포 액션 관찰)은 루트 CLAUDE.md 의 "Dependabot" 절을 따른다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      # 배포 워크플로(deploy-backend.yml) 전용 액션 — PR CI(Gate)가 검증하지 못하므로 따로 묶는다.
      # 그룹은 먼저 매칭된 쪽에 들어가므로 이 항목이 actions 보다 앞에 있어야 한다.
      actions-deploy:
        patterns: ["docker/*", "appleboy/*"]
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Gradle wrapper 도 이 묶음으로 온다. BOM 관리 버전·extra["…version"] 오버라이드는 갱신 대상이 아니다.
      # QueryDSL 포크 6.x 줄은 6.12 에서 끝났다. 버전 업데이트로는 7.x 가 오지 않는다(메이저 제외).
      # 보안 업데이트는 이 제약이 없어 7.x 를 제안할 수 있다 — 7.x 는 Hibernate 7 전용이라 그 PR 은 머지하지 않고 닫는다(Boot 4 전환 때 함께 올린다).
      backend:
        patterns: ["*"]
