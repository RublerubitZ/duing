# 백엔드 CD — main 에 백엔드/배포 설정이 올라오면 이미지를 빌드해 GHCR 에 push 하고,
# AWS Lightsail VM 에 SSH 로 배포(이미지 갱신 → docker compose up → 헬스 확인 → 실패 시 자동 롤백)한다.
#
# 전제: 이 워크플로가 성공하려면 main 에 다음이 이미 있어야 한다(배포 PR 들이 모두 머지된 상태) —
#   - backend/Dockerfile, deploy/docker-compose.yml, deploy/Caddyfile  (컨테이너화 PR)
#   - 서버(Lightsail)에는 배포 디렉터리와 운영값이 채워진 .env 가 준비되어 있어야 한다(deploy/README.md).
#     .env 의 필수값(DB_*, JWT_SECRET, EMAIL_VERIFICATION_SECRET, CORS_ALLOWED_ORIGINS, S3_*, RESEND_*,
#     SENTRY_DSN 등)이 비면 백엔드가 부팅에 실패하고 → 헬스 게이트가 배포를 실패 처리한다.
# main 은 CI 를 통과한 develop 에서 머지되므로 이 워크플로는 별도 테스트 게이트 없이 배포에 집중한다.
#
# 다운타임: 단일 인스턴스 recreate 방식이라 배포 중 수십 초 다운타임이 발생한다(무중단 아님).
#           새 이미지가 healthy 에 도달하지 못하면 직전 이미지로 자동 롤백한다.
#
# 필요한 GitHub Secrets:
#   LIGHTSAIL_HOST       Lightsail 고정 IP 또는 호스트명
#   LIGHTSAIL_USER       SSH 사용자(예: ubuntu) — docker 권한 보유(docker 그룹)
#   LIGHTSAIL_SSH_KEY    배포용 SSH 개인키(PEM 전체)
#   LIGHTSAIL_SSH_PORT   (선택) SSH 포트, 기본 22
#   DEPLOY_DIR           (선택) 서버 배포 디렉터리 절대경로, 기본 /home/ubuntu/duing
# GHCR push/pull 은 워크플로 기본 GITHUB_TOKEN(packages 권한)으로 처리한다.
# 패키지가 Private 이어도 동작한다 — 이 레포가 패키지를 발행하며 admin 권한을 자동 보유하기 때문.
# 단, 서버에서의 *수동* pull 은 별도 classic PAT(read:packages) 로그인이 필요하다(deploy/README.md).
#
# 보안 메모: 서드파티 액션(appleboy/*)은 SSH 키를 다루므로 공급망 변조 차단을 위해 모든 uses 를
# 태그가 아닌 full commit SHA 로 핀 고정해 둔다(태그 주석은 참고용). 배포 승인 게이트가 필요하면 GitHub 의
# production 환경에 required reviewers 를 설정한다(이 잡은 environment: production 에 묶여 있다).

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rublerubitz/duing-backend

jobs:
  deploy:
    name: Build · Push · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버의 compose/Caddyfile 을 저장소 최신본으로 동기화하되, 곧바로 덮어쓰지 않고 incoming/ 스테이징
      # 디렉터리로만 보낸다. 실제 반영은 다음 SSH 스텝에서 문법 검증을 통과한 뒤에만 원자적으로 이뤄진다
      # (.env 는 서버 관리값이라 건드리지 않는다).
      - name: Stage deploy config to server (incoming/)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || '22' }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: ${{ secrets.DEPLOY_DIR || '/home/ubuntu/duing' }}/incoming
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || '22' }}
          envs: DEPLOY_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            # 임시 DOCKER_CONFIG 로 격리 로그인 — 서버에 상주하는 수동 pull 용 PAT 로그인
            # (~/.docker/config.json)을 덮어쓰지 않는다. GITHUB_TOKEN 은 잡 종료 시 만료되므로
            # 운영자 PAT 와 분리해 둬야 배포 후에도 수동 docker pull 이 깨지지 않는다.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            # 기존 docker 설정(credHelpers·타 레지스트리 인증 등)은 보존하고 ghcr 로그인만 격리 사본에 덮어쓴다
            # — caddy 등 비-GHCR 이미지 pull 이 영향받지 않게.
            cp -a "${HOME}/.docker/config.json" "$DOCKER_CONFIG/config.json" 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 롤백 대비: 현재 .env 에 적힌 이미지 태그를 보관한다.
            PREV_IMAGE="$(grep '^BACKEND_IMAGE=' .env | cut -d= -f2- || true)"

            # ── 배포 설정 사전 검증 + 원자적 반영 (이미지 교체보다 먼저) ─────────────────
            # incoming/ 에 스테이징된 새 compose·Caddyfile 을 현 운영 .env 와 함께 검증한다.
            # 둘 다 통과할 때만 기존 파일을 .bak 로 백업하고 mv(원자적 교체)로 반영한다.
            # 검증 실패 시 기존 파일을 그대로 두고 즉시 배포를 중단한다 — 오설정이 서버에 닿지 않는다.
            if [ ! -f incoming/docker-compose.yml ] || [ ! -f incoming/Caddyfile ]; then
              echo "::error::incoming/ 에 docker-compose.yml·Caddyfile 이 없습니다 — 스테이징 실패"
              exit 1
            fi
            # compose 검증: env_file(.env)·보간(${BACKEND_IMAGE} 등)이 모두 현 운영 .env 기준으로 풀리도록
            # incoming/ 에 현 .env 사본을 두고 검증한다(검증 후 즉시 삭제 — 시크릿 사본을 남기지 않는다).
            cp .env incoming/.env
            if ! docker compose -f incoming/docker-compose.yml config --quiet; then
              rm -f incoming/.env
              echo "::error::새 docker-compose.yml 검증 실패 — 기존 설정 유지·배포 중단"
              exit 1
            fi
            rm -f incoming/.env
            # Caddyfile 검증: 서버에 이미 존재하는 caddy 이미지로 stdin 검증(컨테이너 상태와 무관하게 동작).
            if ! docker run --rm -i caddy:2-alpine caddy validate --config - --adapter caddyfile < incoming/Caddyfile; then
              echo "::error::새 Caddyfile 검증 실패 — 기존 설정 유지·배포 중단"
              exit 1
            fi
            # 둘 다 통과: 기존 정상본 백업 후 반영.
            # ⚠ Caddyfile 은 compose 가 단일 파일 bind mount(./Caddyfile:...:ro)로 물고 있어 실행 중인 caddy
            #   컨테이너가 그 inode 를 계속 본다 → mv(새 inode)는 컨테이너에 보이지 않고, 이어지는 reload 가
            #   구 설정을 읽어 "성공"한다(변경 조용히 미적용 · 리부트 때 예고 없이 적용되는 시한폭탄).
            #   cp(대상 파일 in-place truncate+write)는 inode 를 유지해 컨테이너에 즉시 보이므로 reload 가 새 설정을 읽는다.
            #   compose 는 호스트 docker CLI 가 매번 경로로 새로 읽어 mv 도 무방하나, 반쪽 상태를 없애려 cp+rm 로 통일한다.
            #   (여기서 reload·compose pull/up 은 이 블록 이후 순차 실행이라 cp 의 비원자성으로 인한 torn read 는 없다.)
            # 백업: 파일이 있으면 반드시 성공해야 한다(cp 실패 시 교체 중단) — 최초 배포(파일 없음)만 스킵.
            if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.yml.bak; fi
            if [ -f Caddyfile ]; then cp Caddyfile Caddyfile.bak; fi
            cp incoming/docker-compose.yml docker-compose.yml && rm incoming/docker-compose.yml
            cp incoming/Caddyfile Caddyfile && rm incoming/Caddyfile
            echo "배포 설정 검증 통과 — compose·Caddyfile 반영 완료"
            # ────────────────────────────────────────────────────────────────────────────

            # 이번 배포 이미지 태그(커밋 SHA)를 .env 의 BACKEND_IMAGE 에 반영(멱등) — 수동 재기동도 같은 버전.
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${DEPLOY_IMAGE}|" .env
            else
              echo "BACKEND_IMAGE=${DEPLOY_IMAGE}" >> .env
            fi

            docker compose pull backend
            docker compose up -d   # 단일 인스턴스 recreate — 수십 초 다운타임 발생

            # 새 백엔드가 healthy 가 될 때까지 최대 ~100s 대기.
            healthy=false
            for attempt in $(seq 1 20); do
              cid="$(docker compose ps -q backend)"
              status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)"
              echo "backend health: ${status} (${attempt}/20)"
              if [ "$status" = "healthy" ]; then healthy=true; break; fi
              sleep 5
            done

            if [ "$healthy" = "true" ]; then
              # 정상: Caddyfile 변경분 무중단 반영(없으면 무해). reload 실패 시 "재시작"이 아니라 직전 정상본(.bak)
              # 으로 복원한 뒤 reload — 잘못된 설정으로 재시작해 기존 정상 상태까지 무너뜨리는 사고를 막는다.
              # (사전 검증을 통과했어도 런타임 reload 는 별개 실패 가능성이 있어 안전망을 둔다.)
              caddy_reflected=true
              if ! docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                echo "::warning::caddy reload 실패 — 직전 Caddyfile(.bak)로 복원 후 재적용"
                if [ -f Caddyfile.bak ]; then
                  cp Caddyfile.bak Caddyfile
                  if ! docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                    echo "::error::백업 Caddyfile 재적용도 실패 — 라우팅 수동 점검 필요"
                    caddy_reflected=false
                  fi
                else
                  echo "::error::복원할 Caddyfile.bak 이 없습니다 — 라우팅 수동 점검 필요"
                  caddy_reflected=false
                fi
              fi
              docker image prune -f || true
              if [ "$caddy_reflected" != "true" ]; then
                # 이미지 배포·헬스는 성공했으나 Caddy 설정 반영 실패 — 프록시가 수동 개입 필요 상태.
                # 잡을 녹색(exit 0)으로 두면 이 신호를 놓치므로 exit 1 로 알린다(잡 재실행은 멱등이라 무해).
                echo "::error::이미지 배포는 성공, Caddy 설정 반영 실패 — 수동 확인 필요: ${DEPLOY_IMAGE}"
                exit 1
              fi
              echo "배포 완료: ${DEPLOY_IMAGE}"
              exit 0
            fi

            # 실패: 직전 이미지로 자동 롤백(베스트 에포트).
            echo "::error::backend 가 healthy 에 도달하지 못했습니다 — 직전 이미지로 롤백: ${PREV_IMAGE:-(이전 값 없음)}"
            if [ -n "$PREV_IMAGE" ] && [ "$PREV_IMAGE" != "$DEPLOY_IMAGE" ]; then
              # 이미지와 함께 배포된 설정도 직전 상태로 복원 — 신규 compose 가 구 이미지와 비호환일 수 있다.
              # (cp 는 in-place 라 Caddyfile bind-mount inode 도 보존된다)
              if [ -f docker-compose.yml.bak ]; then cp docker-compose.yml.bak docker-compose.yml; fi
              if [ -f Caddyfile.bak ]; then cp Caddyfile.bak Caddyfile; fi
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${PREV_IMAGE}|" .env
              docker compose pull backend || true
              docker compose up -d || true
            fi
            exit 1
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/home/ubuntu/duing' }}
