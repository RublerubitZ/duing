# 백엔드 CD — main 에 백엔드/배포 설정이 올라오면 이미지를 빌드해 GHCR 에 push 하고,
# AWS Lightsail VM 에 SSH 로 배포(새 이미지 받기 → 설정 교체 → docker compose up → 헬스 확인 → 설정 교체 뒤 헬스 게이트 통과 전 실패 시 자동 롤백)한다.
#
# 전제: 이 워크플로가 성공하려면 main 에 다음이 이미 있어야 한다(배포 PR 들이 모두 머지된 상태) —
#   - backend/Dockerfile, deploy/docker-compose.yml, deploy/Caddyfile  (컨테이너화 PR)
#   - 서버(Lightsail)에는 배포 디렉터리와 운영값이 채워진 .env 가 준비되어 있어야 한다(deploy/README.md).
#     .env 의 필수값(DB_*, JWT_SECRET, EMAIL_VERIFICATION_SECRET, CORS_ALLOWED_ORIGINS, S3_*, RESEND_*,
#     SENTRY_DSN 등)이 비면 백엔드가 부팅에 실패하고 → 헬스 게이트가 배포를 실패 처리한다.
# main 은 CI 를 통과한 develop 에서 머지되므로 이 워크플로는 별도 테스트 게이트 없이 배포에 집중한다.
#
# 다운타임: 단일 인스턴스 recreate 방식이라 배포 중 수십 초 다운타임이 발생한다(무중단 아님).
#           설정을 교체한 뒤 헬스 게이트를 통과하지 못하면(up 실패·healthy 미도달 등) 배포 전 설정과 직전 이미지로 자동 롤백한다.
#
# 필요한 GitHub Secrets:
#   LIGHTSAIL_HOST       Lightsail 고정 IP 또는 호스트명
#   LIGHTSAIL_USER       SSH 사용자(예: ubuntu) — docker 권한 보유(docker 그룹)
#   LIGHTSAIL_SSH_KEY    배포용 SSH 개인키(PEM 전체)
#   LIGHTSAIL_SSH_PORT   (선택) SSH 포트, 기본 22
#   DEPLOY_DIR           (선택) 서버 배포 디렉터리 절대경로, 기본 /home/ubuntu/duing
# GHCR push/pull 은 워크플로 기본 GITHUB_TOKEN(packages 권한)으로 처리한다.
# 패키지가 Private 이어도 동작한다 — 이 레포가 패키지를 발행하며 admin 권한을 자동 보유하기 때문.
# 단, 서버에서의 *수동* pull 은 별도 classic PAT(read:packages) 로그인이 필요하다(deploy/README.md).
#
# 보안 메모: 서드파티 액션(appleboy/*)은 SSH 키를 다루므로 공급망 변조 차단을 위해 모든 uses 를
# 태그가 아닌 full commit SHA 로 핀 고정해 둔다(태그 주석은 참고용). 배포 승인 게이트가 필요하면 GitHub 의
# production 환경에 required reviewers 를 설정한다(이 잡은 environment: production 에 묶여 있다).

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      # deploy/ 아래 문서는 배포 대상이 아니다 — 서버로 올라가는 건 docker-compose.yml·Caddyfile 뿐인데
      # (Stage 스텝의 source 참고), 이 잡은 `docker compose up -d` 로 단일 인스턴스를 recreate 해 수십 초
      # 백엔드를 내린다. 실제로 2026-08-10 릴리스에서 UPTIME.md 한 줄 때문에 운영 백엔드가 재기동됐고,
      # 그 순단 창에 홈 ISR 재생성이 502 를 맞아 Sentry 에 5건이 찍혔다(사용자 영향은 stale 서빙으로 없었음).
      # `deploy/**` 자체는 남겨둔다 — 새 배포 파일이 추가돼도 자동으로 잡히는 fail-safe 가 낫다.
      - '!deploy/**.md'
      # backend/ 아래 문서와 테스트 소스도 배포 산출물에 들어가지 않는다(Dockerfile 은 bootJar -x test) — 2026-09 에는
      # CLAUDE.md 한 줄·테스트용 MinIO 이미지 교체만으로 프론트 중심 릴리스가 백엔드 재기동을 부르게 됐다.
      - '!backend/**.md'
      - '!backend/src/test/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rublerubitz/duing-backend

jobs:
  deploy:
    name: Build · Push · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버의 compose/Caddyfile 을 저장소 최신본으로 동기화하되, 곧바로 덮어쓰지 않고 incoming/ 스테이징
      # 디렉터리로만 보낸다. 실제 반영은 다음 SSH 스텝에서 문법 검증을 통과한 뒤에만 원자적으로 이뤄진다
      # (.env 는 서버 관리값이라 건드리지 않는다).
      - name: Stage deploy config to server (incoming/)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || '22' }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: ${{ secrets.DEPLOY_DIR || '/home/ubuntu/duing' }}/incoming
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || '22' }}
          envs: DEPLOY_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script: |
            set -euo pipefail
            # 아래 전체를 { } 한 묶음으로 둔다 — bash 는 최상위 명령을 하나씩 읽고 실행하므로, 묶지 않으면 뒤쪽의 문법 오류가
            # 앞쪽(설정 교체·.env 반영)을 실행한 뒤에야 걸린다. 묶으면 문법 오류가 어디에 있든 아무 명령도 실행하지 않고 끝난다.
            {
            cd "$DEPLOY_DIR"
            # 임시 DOCKER_CONFIG 로 격리 로그인 — 서버에 상주하는 수동 pull 용 PAT 로그인
            # (~/.docker/config.json)을 덮어쓰지 않는다. GITHUB_TOKEN 은 잡 종료 시 만료되므로
            # 운영자 PAT 와 분리해 둬야 배포 후에도 수동 docker pull 이 깨지지 않는다.
            export DOCKER_CONFIG="$(mktemp -d)"
            # 종료 트랩 — 설정 교체를 시작했고(swapped) 헬스 게이트를 통과하지 못했으면(settled 아님) 어떻게 끝나든(exit·set -e·출력 끊김)
            # 두 설정 파일과 .env 의 BACKEND_IMAGE 를 배포 전 값으로 되돌리고 확인한 뒤 다시 띄운다. 끝에 DOCKER_CONFIG 를 지우고
            # 원래 종료 코드로 끝난다. 강제 종료(kill -9·서버 중단)는 보장하지 않는다(deploy/UPTIME.md 의 Caddy 롤백 (증상별)).
            swapped=false
            settled=false
            PREV_IMAGE=""
            on_exit() {
              local exit_code=$? restored=true file docker_log=/dev/null up_status
              # ssh-action 은 PTY 없이 돌려 SSH 끊김·명령 제한 시간·잡 취소가 여기에는 다음 출력의 SIGPIPE 로 온다(본문은 거기서 끝난다).
              # 트랩은 끝까지 돈다 — SIGPIPE 를 무시하고, 출력이 실패하면 표준 출력·오류를 버린 뒤 계속한다(아래 R0·R1 의 || exec).
              # 되돌리는 docker 명령은 출력을 파일로 받아 끝난 뒤 찍는다 — 도는 동안 연결이 끊겨도 끊긴 파이프에 쓰다 죽지 않게.
              trap '' PIPE
              # 되돌리기는 한 단계가 실패해도 나머지를 계속한다. 트랩 안의 exit 는 이 트랩을 다시 부르지 않는다.
              set +e
              if [ "$swapped" = "true" ] && [ "$settled" != "true" ]; then
                # 최초 배포(두 .bak 이 모두 없다)는 되돌릴 배포 전 파일이 없다 — .env 의 BACKEND_IMAGE 유무와 상관없이 건너뛴다.
                if [ ! -f docker-compose.yml.bak ] && [ ! -f Caddyfile.bak ]; then
                  echo "되돌릴 직전 설정이 없습니다(최초 배포) — 되돌리기를 건너뜁니다"
                else
                  echo "배포가 끝나지 않았습니다 — 설정 파일·이미지 태그를 배포 전 상태로 되돌립니다" || exec >/dev/null 2>&1
                  # Caddyfile 먼저 — 전환 배포(옛 버전·h1 → 새 버전·h1 h2)에서 중간 상태가 '새 버전 + h1' 이 되는 순서다.
                  # 내용이 같으면 쓰지 않는다 — cp 는 대상을 자른 뒤 쓰므로 디스크가 가득 찼을 때 멀쩡한 파일까지 망가뜨린다.
                  for file in Caddyfile docker-compose.yml; do
                    if [ -f "$file.bak" ] && ! cmp -s "$file.bak" "$file"; then cp "$file.bak" "$file"; fi
                  done
                  if [ -n "$PREV_IMAGE" ] && ! grep -qxF "BACKEND_IMAGE=${PREV_IMAGE}" .env; then
                    sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${PREV_IMAGE}|" .env
                  fi
                  for file in Caddyfile docker-compose.yml; do
                    if [ -f "$file.bak" ] && ! cmp -s "$file.bak" "$file"; then restored=false; fi
                  done
                  if [ -n "$PREV_IMAGE" ] && ! grep -qxF "BACKEND_IMAGE=${PREV_IMAGE}" .env; then restored=false; fi
                  if [ "$restored" = "true" ]; then
                    echo "되돌리기 확인 — docker-compose.yml·Caddyfile·BACKEND_IMAGE 는 배포 전 상태입니다" || exec >/dev/null 2>&1
                    # 받을 파일을 만들지 못하면(DOCKER_CONFIG 가 비었을 때 등) 출력을 버리고 그대로 돌린다.
                    if [ -n "$DOCKER_CONFIG" ] && : 2>/dev/null > "$DOCKER_CONFIG/rollback-docker.log"; then docker_log="$DOCKER_CONFIG/rollback-docker.log"; fi
                    if [ "$PREV_IMAGE" != "$DEPLOY_IMAGE" ]; then docker compose pull backend >> "$docker_log" 2>&1 || true; fi
                    docker compose up -d >> "$docker_log" 2>&1
                    up_status=$?
                    cat "$docker_log"   # 연결이 끊겼으면 찍다가 실패한다 — 무시한다
                    if [ "$up_status" -ne 0 ]; then echo "::error::되돌린 설정으로 컨테이너를 다시 띄우지 못했습니다 — 컨테이너 상태 수동 확인 필요"; fi
                  else
                    # 파일 상태를 모르는 채 컨테이너를 다시 만들지 않는다.
                    echo "::error::되돌리기 실패 — docker-compose.yml·Caddyfile·.env 수동 확인 필요(이 실행은 re-run 하지 않는다 — deploy/UPTIME.md 의 Caddy 롤백 (증상별))"
                  fi
                fi
              fi
              rm -rf "$DOCKER_CONFIG"
              exit "$exit_code"
            }
            trap on_exit EXIT
            # 기존 docker 설정(credHelpers·타 레지스트리 인증 등)은 보존하고 ghcr 로그인만 격리 사본에 덮어쓴다
            # — caddy 등 비-GHCR 이미지 pull 이 영향받지 않게.
            cp -a "${HOME}/.docker/config.json" "$DOCKER_CONFIG/config.json" 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 롤백 대비: 현재 .env 에 적힌 이미지 태그를 보관한다(줄이 여럿이면 마지막 줄).
            PREV_IMAGE="$(grep '^BACKEND_IMAGE=' .env | tail -n 1 | cut -d= -f2- || true)"
            echo "직전 이미지(롤백 기준): ${PREV_IMAGE:-(이전 값 없음)}"

            # ── 배포 설정 사전 검증 + 원자적 반영 (이미지 교체보다 먼저) ─────────────────
            # incoming/ 에 스테이징된 새 compose·Caddyfile 을 현 운영 .env 와 함께 검증한다.
            # 둘 다 통과하고 새 백엔드 이미지를 받은 뒤에만 기존 파일을 .bak 로 백업하고 cp(in-place)로 반영한다.
            # 검증 실패 시 기존 파일을 그대로 두고 즉시 배포를 중단한다 — 오설정이 서버에 닿지 않는다.
            if [ ! -f incoming/docker-compose.yml ] || [ ! -f incoming/Caddyfile ]; then
              echo "::error::incoming/ 에 docker-compose.yml·Caddyfile 이 없습니다 — 스테이징 실패"
              exit 1
            fi
            # compose 검증: env_file(.env)·보간(${BACKEND_IMAGE} 등)이 모두 현 운영 .env 기준으로 풀리도록
            # incoming/ 에 현 .env 사본을 두고 검증한다(검증 후 즉시 삭제 — 시크릿 사본을 남기지 않는다).
            cp .env incoming/.env
            if ! docker compose -f incoming/docker-compose.yml config --quiet; then
              rm -f incoming/.env
              echo "::error::새 docker-compose.yml 검증 실패 — 기존 설정 유지·배포 중단"
              exit 1
            fi
            rm -f incoming/.env
            # Caddyfile 검증: docker-compose.yml 과 같은 고정 태그의 caddy 이미지로 stdin 검증(컨테이너 상태와 무관, 없으면 받아 온다).
            if ! docker run --rm -i caddy:2.11.9-alpine caddy validate --config - --adapter caddyfile < incoming/Caddyfile; then
              echo "::error::새 Caddyfile 검증 실패(검증 이미지 pull 실패일 수도 있음) — 기존 설정 유지·배포 중단"
              exit 1
            fi
            # 새 백엔드 이미지는 설정 교체 전에 받는다 — 받기에 실패하면(GHCR 인증 실패 포함) 서버 파일은 그대로다.
            # 정상 경로에서는 교체 뒤 레지스트리에 가지 않는다(아래 up -d 가 여기서 받은 이미지를 쓴다 — 되돌릴 때만 직전 이미지를 compose pull backend || true 로 받는다).
            if ! docker pull "$DEPLOY_IMAGE"; then
              echo "::error::새 백엔드 이미지를 받지 못했습니다 — 기존 설정 유지·배포 중단: ${DEPLOY_IMAGE}"
              exit 1
            fi
            # 둘 다 통과: 기존 정상본 백업 후 반영.
            # ⚠ Caddyfile 은 compose 가 단일 파일 bind mount(./Caddyfile:...:ro)로 물고 있어 실행 중인 caddy
            #   컨테이너가 그 inode 를 계속 본다 → mv(새 inode)는 컨테이너에 보이지 않고, 이어지는 reload 가
            #   구 설정을 읽어 "성공"한다(변경 조용히 미적용 · 리부트 때 예고 없이 적용되는 시한폭탄).
            #   cp(대상 파일 in-place truncate+write)는 inode 를 유지해 컨테이너에 즉시 보이므로 reload 가 새 설정을 읽는다.
            #   compose 는 호스트 docker CLI 가 매번 경로로 새로 읽어 mv 도 무방하나, 반쪽 상태를 없애려 cp+rm 로 통일한다.
            #   (여기서 reload·compose up 은 이 블록 이후 순차 실행이라 cp 의 비원자성으로 인한 torn read 는 없다.)
            # 백업: 파일이 있으면 반드시 성공해야 한다(cp 실패 시 교체 중단) — 최초 배포(파일 없음)만 스킵.
            if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.yml.bak; fi
            if [ -f Caddyfile ]; then cp Caddyfile Caddyfile.bak; fi
            # 여기부터 헬스 게이트까지 가지 못하면 종료 트랩이 되돌린다. compose 를 먼저 바꾸고, 하나라도 실패하면 거기서 멈춘다.
            swapped=true
            if ! cp incoming/docker-compose.yml docker-compose.yml || ! cp incoming/Caddyfile Caddyfile; then
              echo "::error::설정 파일 교체 실패 — 배포 중단"
              exit 1
            fi
            rm -f incoming/docker-compose.yml incoming/Caddyfile || true   # 남아도 다음 배포의 scp 가 덮는다
            echo "배포 설정 검증 통과 — compose·Caddyfile 반영 완료"
            # ────────────────────────────────────────────────────────────────────────────

            # 이번 배포 이미지 태그(커밋 SHA)를 .env 의 BACKEND_IMAGE 에 반영(멱등) — 수동 재기동도 같은 버전.
            # 쓰기 실패로 바로 끝나지 않게(|| true) 쓰고, 그 값의 줄이 있는지 되읽어 판정한다(sed 는 BACKEND_IMAGE 줄을 모두 바꾼다).
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${DEPLOY_IMAGE}|" .env || true
            else
              echo "BACKEND_IMAGE=${DEPLOY_IMAGE}" >> .env || true
            fi
            if ! grep -qxF "BACKEND_IMAGE=${DEPLOY_IMAGE}" .env; then
              echo "::error::.env 의 BACKEND_IMAGE 반영 실패 — 배포 중단"
              exit 1
            fi

            # 단일 인스턴스 recreate — 수십 초 다운타임 발생. 이미지는 위에서 받았다(pull 하지 않는다).
            if ! docker compose up -d; then
              echo "::error::docker compose up 실패 — 직전 이미지로 롤백: ${PREV_IMAGE:-(이전 값 없음)}"
              exit 1
            fi

            # 새 백엔드가 healthy 가 될 때까지 최대 ~100s 대기.
            healthy=false
            for attempt in $(seq 1 20); do
              cid="$(docker compose ps -q backend || true)"   # 조회가 실패해도 루프는 계속 돈다(빈 cid 는 starting)
              status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)"
              echo "backend health: ${status} (${attempt}/20)"
              if [ "$status" = "healthy" ]; then healthy=true; break; fi
              sleep 5
            done

            if [ "$healthy" = "true" ]; then
              # 헬스 게이트 통과 — 여기부터의 실패(reload)는 종료 트랩이 되돌리지 않는다(아래 처리 그대로).
              settled=true
              # 정상: Caddyfile 변경분 무중단 반영(없으면 무해). reload 실패 시 "재시작"이 아니라 직전 정상본(.bak)
              # 으로 복원한 뒤 reload — 잘못된 설정으로 재시작해 기존 정상 상태까지 무너뜨리는 사고를 막는다.
              # (사전 검증을 통과했어도 런타임 reload 는 별개 실패 가능성이 있어 안전망을 둔다.)
              caddy_reflected=true
              if ! docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                echo "::warning::caddy reload 실패 — 직전 Caddyfile(.bak)로 복원 후 재적용"
                if [ -f Caddyfile.bak ]; then
                  cp Caddyfile.bak Caddyfile
                  if ! docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                    echo "::error::백업 Caddyfile 재적용도 실패 — 라우팅 수동 점검 필요"
                    caddy_reflected=false
                  fi
                else
                  echo "::error::복원할 Caddyfile.bak 이 없습니다 — 라우팅 수동 점검 필요"
                  caddy_reflected=false
                fi
              fi
              docker image prune -f || true
              if [ "$caddy_reflected" != "true" ]; then
                # 이미지 배포·헬스는 성공했으나 Caddy 설정 반영 실패 — 프록시가 수동 개입 필요 상태.
                # 잡을 녹색(exit 0)으로 두면 이 신호를 놓치므로 exit 1 로 알린다(이 잡은 re-run 하지 않는다 — re-run 은 .bak 을 지금 파일로 덮어 되돌릴 사본이 사라진다. deploy/UPTIME.md 의 Caddy 롤백 (증상별)).
                echo "::error::이미지 배포는 성공, Caddy 설정 반영 실패 — 수동 확인 필요: ${DEPLOY_IMAGE}"
                exit 1
              fi
              echo "배포 완료: ${DEPLOY_IMAGE}"
              exit 0
            fi

            # 실패: 종료 트랩(on_exit)이 두 설정 파일·.env 를 배포 전으로 되돌리고 확인한 뒤 직전 이미지로 다시 띄운다.
            echo "::error::backend 가 healthy 에 도달하지 못했습니다 — 직전 이미지로 롤백: ${PREV_IMAGE:-(이전 값 없음)}"
            exit 1
            }
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/home/ubuntu/duing' }}

      # 배포 결과 Slack 알림(성공·실패·취소 모두). GitHub Secret SLACK_WEBHOOK_URL 이 없으면 조용히 생략한다.
      # 서드파티 액션 없이 curl+jq 만 쓴다 — SSH 키를 다루는 잡이라 공급망 표면을 늘리지 않는다.
      # 알림 실패는 배포 결과를 바꾸지 않는다(항상 exit 0). 채널·형식은 deploy/MONITORING.md.
      - name: Notify Slack (deploy result)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 기본 셸이 -e 라 어떤 명령이 실패해도 아래 exit 0 까지 도달하도록 끈다 — 알림 실패는 배포 결과를 바꾸지 않는다.
          set +e
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 배포 알림 생략"
            exit 0
          fi
          case "$JOB_STATUS" in
            success)   ICON="🚀"; STATUS="SUCCESS" ;;
            cancelled) ICON="⚪"; STATUS="CANCELLED (설정 교체 뒤 헬스 게이트 통과 전이었다면 로그 없이 배포 전 설정·직전 이미지로 되돌렸을 수 있음 — re-run 전에 deploy/UPTIME.md 의 '상태를 모를 때' 따르기)" ;;
            *)         ICON="🔴"; STATUS="FAILURE (설정 교체 뒤 헬스 게이트 통과 전 실패면 배포 전 설정·직전 이미지로 자동 롤백 시도됨 — 실행 로그의 끝 줄 확인)" ;;
          esac
          TEXT="$(printf '%s\n' \
            "${ICON} Deployment" \
            "서비스: Duing" \
            "환경: production" \
            "release: ${RELEASE_SHA}" \
            "status: ${STATUS}" \
            "시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" \
            "실행: ${RUN_URL}")"
          PAYLOAD="$(jq -cn --arg text "$TEXT" '{text: $text}')"
          # URL 은 시크릿 — 실패 시에도 에러 본문을 출력하지 않는다.
          if ! curl -sS -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' \
               --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" 2>/dev/null; then
            echo "::warning::Slack 배포 알림 전송 실패(배포 결과와 무관)"
          fi
          exit 0
