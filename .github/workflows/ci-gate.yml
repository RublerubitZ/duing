name: CI Gate

# 모든 PR 에서 무조건 실행되는 단일 필수 체크.
#
# 왜 필요한가: backend-ci / frontend-ci / deploy-config-ci 는 path 필터가 걸려 있어, 해당 경로를
# 건드리지 않은 PR 에서는 체크 자체가 생성되지 않는다. 그 상태로 브랜치 보호에 이 체크들을 필수로
# 지정하면 GitHub 이 "보고되지 않은 필수 체크" 를 pending 으로 간주해 PR 이 영구히 머지 불가가 된다.
#
# 왜 workflow_run 이 아닌가: 상류 워크플로가 아예 실행되지 않으면 workflow_run 도 발생하지 않아
# 게이트가 생성되지 않는다 — 해결하려는 문제가 그대로 남는다. workflow_call 로 이 런 안에서
# 직접 호출하면 호출된 잡이 이 런의 잡이 되어 needs 로 결과를 그대로 읽을 수 있다.
#
# 가짜 초록 방지: 아래 gate 잡은 "변경이 있었는데 성공이 아닌" 경우와 "변경이 없었는데 skipped 가
# 아닌" 경우를 모두 실패로 처리한다. 판정 근거(changes)와 실행 결과(needs.*.result)가 같은 런 안에
# 있으므로, 검사가 돌지 않았는데 통과하는 경로가 구조적으로 존재하지 않는다.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      # 체크아웃하지 않는다 — 변경 파일 목록만 있으면 되고, API 가 base...head 비교를 대신한다.
      # (fetch-depth: 0 체크아웃은 이 판정 하나 때문에 저장소 전체를 받는 비용이다.)
      - name: List changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > changed.txt
          echo "변경 파일 $(wc -l < changed.txt) 건"
          cat changed.txt

      - name: Classify
        id: filter
        run: |
          set -euo pipefail
          backend=false
          frontend=false
          deploy=false

          # 게이트 자신이 바뀌면 판정 로직 자체가 검증 대상이라 전 영역을 모두 돌린다(누락 방지).
          if grep -qE '^\.github/workflows/ci-gate\.yml$' changed.txt; then
            backend=true
            frontend=true
            deploy=true
          fi
          if grep -qE '^backend/|^\.github/workflows/backend-ci\.yml$' changed.txt; then
            backend=true
          fi
          if grep -qE '^frontend/|^\.github/workflows/frontend-ci\.yml$' changed.txt; then
            frontend=true
          fi
          if grep -qE '^deploy/|^\.github/workflows/deploy-config-ci\.yml$' changed.txt; then
            deploy=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "판정 — backend=$backend frontend=$frontend deploy=$deploy"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  deploy-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-config-ci.yml

  gate:
    name: Gate
    needs: [changes, backend, frontend, deploy-config]
    # 앞선 잡이 실패·스킵돼도 반드시 실행돼 결론을 낸다 — 이 잡이 브랜치 보호의 단일 필수 체크다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPLOY_RESULT: ${{ needs.deploy-config.result }}
        run: |
          set -euo pipefail
          failed=0
          fail() { echo "::error::$1"; failed=1; }

          echo "changes=$CHANGES_RESULT | backend: changed=$BACKEND_CHANGED result=$BACKEND_RESULT | frontend: changed=$FRONTEND_CHANGED result=$FRONTEND_RESULT | deploy: changed=$DEPLOY_CHANGED result=$DEPLOY_RESULT"

          # 판정 자체가 실패하면 무엇이 돌았어야 하는지 알 수 없다 — 통과시키지 않는다.
          if [ "$CHANGES_RESULT" != "success" ]; then
            fail "변경 영역 판정 잡이 $CHANGES_RESULT 로 끝났습니다. 무엇을 검사해야 하는지 알 수 없어 게이트를 통과시키지 않습니다."
          fi

          # 변경이 있으면 반드시 success. skipped·cancelled·failure 전부 실패로 본다
          # (검사가 돌지 않았는데 통과하는 경로를 여기서 막는다).
          check() {
            local area="$1" changed="$2" result="$3"
            if [ "$changed" = "true" ]; then
              if [ "$result" != "success" ]; then
                fail "$area 변경이 있는데 $area CI 결과가 '$result' 입니다. 성공이어야 통과합니다."
              fi
            else
              if [ "$result" != "skipped" ]; then
                fail "$area 변경이 없는데 $area CI 결과가 '$result' 입니다. 판정과 실행이 어긋났습니다."
              fi
            fi
          }
          check backend "$BACKEND_CHANGED" "$BACKEND_RESULT"
          check frontend "$FRONTEND_CHANGED" "$FRONTEND_RESULT"
          check deploy-config "$DEPLOY_CHANGED" "$DEPLOY_RESULT"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "게이트 통과 — 필요한 검사가 모두 성공했습니다."
