# 배포 설정 사전 검증 — deploy/ 의 docker-compose.yml·Caddyfile 이 바뀔 때, 서버로 반영되기 전에
# CI 에서 문법을 검증한다. deploy-backend.yml 이 이 파일들을 main 푸시 시 서버로 복사하므로,
# 오설정이 서버까지 도달하지 못하도록 여기서 먼저 막는다(서버측 2차 검증은 deploy-backend.yml 에도 있음).

name: Deploy Config CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-config-ci.yml'
      # 클라이언트 IP 복원 단언이 이 파일의 forward-headers-strategy 를 검사한다(ci-gate.yml 의 판정과 한 쌍).
      - 'backend/src/main/resources/application-prod.yml'
      # 권한·해시 단언이 이 두 파일을 검사한다(ci-gate.yml 의 판정과 한 쌍).
      - '.github/workflows/backup.yml'
      - '.github/workflows/restore-rehearsal.yml'
  # PR 에서는 ci-gate.yml 이 변경 영역을 판정해 이 워크플로를 호출한다(workflow_call).
  # 여기에 pull_request 트리거를 되살리면 게이트 호출분과 이중 실행되므로 두지 않는다.
  # 스택 PR(앞 PR 을 base 로 삼는 후속 PR)도 게이트가 base 브랜치를 가리지 않아 그대로 검사된다.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose & Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate docker-compose.yml
        # 서버의 운영 .env 는 CI 에 없으므로, 파일 문법 검증에 필요한 최소 더미값만 주입한다.
        #  - BACKEND_IMAGE: compose 가 참조하는 유일한 보간 변수(빈 값이면 image 미지정 오류)
        #  - deploy/.env: env_file 로 지정돼 존재해야 하므로 빈 파일로 대체(값 검증이 아니라 문법 검증이 목적)
        env:
          BACKEND_IMAGE: ghcr.io/rublerubitz/duing-backend:ci-validate
        run: |
          touch deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet

      - name: Assert Caddy image tag is pinned and consistent
        # Caddy 는 버전마다 시간 상한 동작이 달라(docker-compose.yml 주석) 운영 이미지를 X.Y.Z 태그로 고정하고, 이 워크플로와
        # deploy-backend.yml 의 검증 이미지도 같은 태그를 쓴다. 어긋나면 CI 와 서버가 서로 다른 버전으로 검증한다.
        # deploy-backend.yml 만 바꾼 PR 은 게이트의 deploy 영역 밖이라 이 단계가 돌지 않는다 — 다음 deploy/** 변경 때 잡힌다.
        run: |
          compose_image=$(grep -oE 'image: caddy:[^[:space:]]+' deploy/docker-compose.yml | cut -d' ' -f2)
          echo "docker-compose.yml: ${compose_image}"
          echo "$compose_image" | grep -qE '^caddy:[0-9]+\.[0-9]+\.[0-9]+-alpine$' \
            || { echo "::error::docker-compose.yml 의 caddy 이미지가 버전 고정 태그(caddy:X.Y.Z-alpine)가 아닙니다: ${compose_image}"; exit 1; }
          for workflow in .github/workflows/deploy-config-ci.yml .github/workflows/deploy-backend.yml; do
            for used_image in $(grep -oE 'caddy:[0-9a-z][0-9a-z.-]*' "$workflow" | sort -u); do
              [ "$used_image" = "$compose_image" ] \
                || { echo "::error::${workflow} 가 ${used_image} 로 검증합니다 — docker-compose.yml(${compose_image})과 같은 태그여야 합니다"; exit 1; }
            done
          done

      - name: Validate Caddyfile
        # caddy 이미지 태그는 deploy/docker-compose.yml 의 caddy 서비스와 같은 고정 태그를 쓴다(위 단계가 어긋남을 막는다).
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Assert client IP restoration is configured
        # api.duings.com 은 Cloudflare DNS only(프록시 OFF)로 직결된다. 백엔드가 보는 getRemoteAddr() 은 Caddy 가
        # TCP 피어 IP 로 채운 X-Forwarded-For 에서 나온다. 신뢰 프록시 부재가 깨지면 IP 축 레이트리밋 6종(로그인 실패·
        # 가입 발급·조회 비콘 등)이 위조값으로 집계되고, native 가 빠지면 톰캣이 XFF 를 무시해 엉뚱한 키로 집계된다.
        # X-Forwarded-For·Proto·Host 덮어쓰기 단언은 비상 모드에서 신뢰 블록을 복원할 때 필요한 짝이라 함께 지킨다.
        # 문법 검증(caddy validate)은 이 중 어느 것도 잡지 못한다 — 전부 어긋나도 문법은 정상이다. 그래서 어댑트된
        # JSON 을 직접 단언한다. (deploy/Caddyfile 주석 참조)
        run: |
          docker run --rm -i caddy:2.11.9-alpine caddy adapt --config - --adapter caddyfile \
            < deploy/Caddyfile > /tmp/caddy-adapted.json
          # 신뢰 프록시가 없어야 한다. 직결에서 Cloudflare 대역을 믿으면 다른 CF 존을 이 오리진으로 겨눠 Cf-Connecting-Ip 를
          # 임의로 정할 수 있다(#1329). 비상 모드(프록시 ON)로 돌아가며 Caddyfile 의 신뢰 블록을 복원할 때는 이 단언도
          # #1112 의 존재 단언으로 함께 되돌린다(어댑트된 설정의 모든 서버를 본다).
          jq -e '[.apps.http.servers[] | .trusted_proxies, .client_ip_headers] | all(. == null)' \
            /tmp/caddy-adapted.json > /dev/null \
            || { echo "::error::Caddy 에 신뢰 프록시 설정이 있습니다 — 직결(DNS only)에서 Cloudflare 대역을 믿으면 다른 CF 존 경유로 Cf-Connecting-Ip 를 위조할 수 있습니다(#1329). 비상 모드(프록시 ON) 전환이라면 Caddyfile 신뢰 블록과 함께 이 단언도 #1112 의 존재 단언으로 되돌리세요"; exit 1; }
          jq -e '[.. | objects | .headers?.request?.set?["X-Forwarded-For"]? // empty]
                 | flatten | index("{http.vars.client_ip}") != null' /tmp/caddy-adapted.json > /dev/null \
            || { echo "::error::reverse_proxy 에 X-Forwarded-For 덮어쓰기가 없습니다 — 비상 모드에서 신뢰 블록을 복원하면 CF 엣지 IP 가 클라이언트 IP 가 됩니다(trusted_proxies 와 한 쌍)"; exit 1; }
          # X-Forwarded-Proto·Host 도 함께 지킨다. 신뢰 프록시를 선언하면 Caddy 가 이 둘을 덮어쓰지 않고
          # 통과시키므로, 지워지면 클라이언트가 보낸 값이 그대로 톰캣의 스킴·getServerName() 이 된다.
          # caddy adapt 가 이 두 줄을 "Unnecessary" 라고 경고해(직결인 지금은 맞는 말이지만 신뢰를 복원하면 틀린다)
          # 지워지기 쉬운 자리라 단언으로 못박는다.
          for forwarded_header in X-Forwarded-Proto X-Forwarded-Host; do
            jq -e --arg h "$forwarded_header" \
               '[.. | objects | .headers?.request?.set?[$h]? // empty] | flatten | length > 0' \
               /tmp/caddy-adapted.json > /dev/null \
              || { echo "::error::reverse_proxy 에 ${forwarded_header} 덮어쓰기가 없습니다 — 신뢰 프록시 선언 뒤에는 클라이언트가 보낸 값이 그대로 통과합니다"; exit 1; }
          done
          grep -qE '^\s*forward-headers-strategy:\s*native\s*$' backend/src/main/resources/application-prod.yml \
            || { echo "::error::application-prod.yml 에 forward-headers-strategy: native 가 없습니다 — 톰캣이 X-Forwarded-For 를 무시합니다"; exit 1; }
          echo "클라이언트 IP 복원 설정 확인 완료"

      - name: Assert Caddy protocols per server, timeouts and HTTP/2 version floor
        # :443 은 HTTP/1.1·2(h1 h2), :80 은 HTTP/1.1(h1)만 받는다 — :80 은 리다이렉트만 해 평문 HTTP/2 를 쓸 곳이 없다. HTTP/3 은
        # UDP 443 을 게시하지 않아 두 서버 모두 끈다(deploy/Caddyfile 의 servers 주석). 서버마다 servers 블록 하나만 적용되므로
        # 시간 상한이 두 서버에 같은 값으로 있는지도 본다(어댑트 JSON 은 나노초 정수 — 10s = 10000000000, 2m = 120000000000).
        # servers 옵션은 어댑트된 서버에만 붙고, Caddy 가 런타임에 따로 만드는 자동 리다이렉트 서버(:80)는 caddy adapt 결과에
        # 없어 보이지 않는다 — 그래서 :80 을 듣는 서버가 설정에 있는지 먼저 단언한다(없으면 :80 이 평문 HTTP/2 를 받는다).
        # 버전 하한: 2.11.8 미만 빌드는 Go HTTP/2 서버 DoS 수정이 없다. :443 에 h2 가 켜진 채 docker-compose.yml 의 버전만 내리면 막는다.
        # 저장소에서 :443 의 HTTP/2 를 일부러 내릴 때는 Caddyfile 과 같은 PR 에서 ① 의 기대값을 ["h1"] 로 고친다(④ 는 그때 저절로 건너뛴다).
        run: |
          docker run --rm -i caddy:2.11.9-alpine caddy adapt --config - --adapter caddyfile \
            < deploy/Caddyfile > /tmp/caddy-adapted-protocols.json
          # ⓪ :80 을 듣는 서버가 설정에 있다
          jq -e '[.apps.http.servers[] | .listen[]?] | index(":80") != null' \
            /tmp/caddy-adapted-protocols.json > /dev/null \
            || { echo "::error::설정에 :80 을 듣는 서버가 없습니다 — Caddy 가 런타임에 만드는 자동 리다이렉트 서버에는 servers 옵션이 붙지 않아 평문 HTTP/2 를 받습니다(deploy/Caddyfile 의 http://api.duings.com 사이트)"; exit 1; }
          # ① :443 서버가 정확히 하나이고 protocols 가 ["h1","h2"]
          jq -e '[.apps.http.servers[] | select((.listen // []) | index(":443"))] | length == 1 and .[0].protocols == ["h1","h2"]' \
            /tmp/caddy-adapted-protocols.json > /dev/null \
            || { echo "::error::Caddy 의 :443 서버가 하나가 아니거나 protocols 가 [\"h1\",\"h2\"] 가 아닙니다 — deploy/Caddyfile 의 servers :443 블록에 protocols h1 h2 를 이 순서로 적습니다. HTTP/2 를 일부러 내리는 것이라면 이 검사의 기대값도 같은 PR 에서 [\"h1\"] 로 고칩니다"; exit 1; }
          # ② :80 서버가 정확히 하나이고 protocols 가 ["h1"]
          jq -e '[.apps.http.servers[] | select((.listen // []) | index(":80"))] | length == 1 and .[0].protocols == ["h1"]' \
            /tmp/caddy-adapted-protocols.json > /dev/null \
            || { echo "::error::Caddy 의 :80 서버가 하나가 아니거나 protocols 가 [\"h1\"] 이 아닙니다 — :80 은 리다이렉트만 해 평문 HTTP/2 를 받지 않습니다(deploy/Caddyfile 의 servers :80 블록)"; exit 1; }
          # ③ 모든 서버의 시간 상한
          jq -e '[.apps.http.servers[] | .read_header_timeout == 10000000000 and .read_timeout == 120000000000] | length > 0 and all' \
            /tmp/caddy-adapted-protocols.json > /dev/null \
            || { echo "::error::시간 상한이 read_header 10s·read_body 2m 가 아닌 서버가 있습니다 — deploy/Caddyfile 의 servers :443·:80 두 블록 모두에 timeouts 를 같은 값으로 적습니다"; exit 1; }
          # ④ 버전 하한 — :443 의 protocols 를 어댑트 결과에서 읽는다. ① 이 ["h1","h2"] 를 요구하는 지금은 늘 하한을 보고,
          #    ① 을 ["h1"] 로 고친 PR(HTTP/2 를 일부러 내릴 때)에서는 h2 가 없어 저절로 건너뛴다.
          if jq -e '[.apps.http.servers[] | select((.listen // []) | index(":443")) | .protocols | index("h2") != null] | any' \
               /tmp/caddy-adapted-protocols.json > /dev/null; then
            minimum_version=2.11.8
            compose_version=$(grep -oE 'image: caddy:[0-9]+\.[0-9]+\.[0-9]+-alpine' deploy/docker-compose.yml | sed -E 's/^image: caddy:([0-9.]+)-alpine$/\1/')
            lowest_version=$(printf '%s\n' "$minimum_version" "$compose_version" | sort -V | head -n 1)
            [ -n "$compose_version" ] && [ "$lowest_version" = "$minimum_version" ] \
              || { echo "::error::docker-compose.yml 의 Caddy 버전(${compose_version:-읽지 못함})이 ${minimum_version} 미만인데 :443 에 HTTP/2 가 켜져 있습니다 — 그 아래 빌드는 Go HTTP/2 서버 DoS 수정이 없습니다. 버전을 올리거나, deploy/Caddyfile 의 :443 을 protocols h1 로 내리면서 같은 PR 에서 이 단계의 :443 프로토콜 검사(①) 기대값도 [\"h1\"] 로 고칩니다"; exit 1; }
          fi
          echo "Caddy 프로토콜·시간 상한·버전 하한 확인 완료"

      - name: Assert DB workflows grant no token permissions and pin the CLI hash
        # backup 은 운영 DB·백업 R2 자격을, restore-rehearsal 은 백업 R2 자격을 쥐고 GITHUB_TOKEN 을 쓰지 않는다 — 최상위 permissions: {} 가
        # 정확히 있고 잡 단위로 다시 주지 않는지, CLI 해시가 워크플로에 인라인 고정돼 있는지 본다(#1302).
        run: |
          for workflow in .github/workflows/backup.yml .github/workflows/restore-rehearsal.yml; do
            grep -qE '^permissions:[[:space:]]*\{\}[[:space:]]*(#.*)?$' "$workflow" \
              || { echo "::error::${workflow} 최상위에 permissions: {} 가 없습니다(#1302)"; exit 1; }
            ! grep -qE '^[[:space:]]+permissions:' "$workflow" \
              || { echo "::error::${workflow} 에 잡 단위 permissions 가 있습니다 — 최상위 {} 를 덮어씁니다"; exit 1; }
          done
          grep -qE '^[[:space:]]+SUPABASE_CLI_SHA256:[[:space:]]+[0-9a-f]{64}([[:space:]]|$)' .github/workflows/backup.yml \
            || { echo "::error::backup.yml 의 Supabase CLI sha256 인라인 고정(SUPABASE_CLI_SHA256)이 없습니다(#1302)"; exit 1; }
          # env 줄만 남기고 설치 run 블록이 checksums.txt 대조로 되돌아가는 것도 막는다 — 고정 해시를 sha256sum -c 에 실제로 쓰는지 본다.
          grep -qE 'SUPABASE_CLI_SHA256\}?"?[^|#]*\|[[:space:]]*sha256sum[[:space:]]+-c' .github/workflows/backup.yml \
            || { echo "::error::backup.yml 이 고정 해시(SUPABASE_CLI_SHA256)로 sha256sum -c 하지 않습니다(#1302)"; exit 1; }
          ! grep -qE '^[^#]*checksums\.txt' .github/workflows/backup.yml \
            || { echo "::error::backup.yml 이 checksums.txt 대조로 되돌아갔습니다(#1302)"; exit 1; }
          echo "DB 워크플로 권한·CLI 해시 고정 확인 완료"
