# 배포 설정 사전 검증 — deploy/ 의 docker-compose.yml·Caddyfile 이 바뀔 때, 서버로 반영되기 전에
# CI 에서 문법을 검증한다. deploy-backend.yml 이 이 파일들을 main 푸시 시 서버로 복사하므로,
# 오설정이 서버까지 도달하지 못하도록 여기서 먼저 막는다(서버측 2차 검증은 deploy-backend.yml 에도 있음).

name: Deploy Config CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-config-ci.yml'
      # 클라이언트 IP 복원 단언이 이 파일의 forward-headers-strategy 를 검사한다(ci-gate.yml 의 판정과 한 쌍).
      - 'backend/src/main/resources/application-prod.yml'
  # PR 에서는 ci-gate.yml 이 변경 영역을 판정해 이 워크플로를 호출한다(workflow_call).
  # 여기에 pull_request 트리거를 되살리면 게이트 호출분과 이중 실행되므로 두지 않는다.
  # 스택 PR(앞 PR 을 base 로 삼는 후속 PR)도 게이트가 base 브랜치를 가리지 않아 그대로 검사된다.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose & Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate docker-compose.yml
        # 서버의 운영 .env 는 CI 에 없으므로, 파일 문법 검증에 필요한 최소 더미값만 주입한다.
        #  - BACKEND_IMAGE: compose 가 참조하는 유일한 보간 변수(빈 값이면 image 미지정 오류)
        #  - deploy/.env: env_file 로 지정돼 존재해야 하므로 빈 파일로 대체(값 검증이 아니라 문법 검증이 목적)
        env:
          BACKEND_IMAGE: ghcr.io/rublerubitz/duing-backend:ci-validate
        run: |
          touch deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet

      - name: Validate Caddyfile
        # caddy 이미지 태그는 deploy/docker-compose.yml 의 caddy 서비스와 동일 버전을 유지해야 한다(현재 caddy:2-alpine).
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Assert client IP restoration is configured
        # api.duings.com 은 Cloudflare 뒤에 있다. 아래 세 가지가 하나라도 빠지면 백엔드가 보는
        # getRemoteAddr() 이 실제 사용자 IP 가 아니라 Cloudflare 엣지 IP 가 되고, IP 축 레이트리밋
        # 6종(로그인 실패·가입 발급·조회 비콘 등)이 전부 CF PoP 단위 전역 제한으로 퇴행한다.
        # 문법 검증(caddy validate)은 이 퇴행을 잡지 못한다 — 셋 다 지워도 문법은 정상이다.
        # 그래서 어댑트된 JSON 을 직접 단언한다. (2026-08-30, deploy/Caddyfile 주석 참조)
        run: |
          docker run --rm -i caddy:2-alpine caddy adapt --config - --adapter caddyfile \
            < deploy/Caddyfile > /tmp/caddy-adapted.json
          jq -e '.apps.http.servers.srv0
                 | (.trusted_proxies.ranges | length > 0)
                   and (.client_ip_headers | map(ascii_downcase)) == ["cf-connecting-ip"]' /tmp/caddy-adapted.json > /dev/null \
            || { echo "::error::Caddy 에 Cloudflare 신뢰 프록시 설정이 없습니다 — 클라이언트 IP 가 CF 엣지 IP 로 집계됩니다"; exit 1; }
          jq -e '[.. | objects | .headers?.request?.set?["X-Forwarded-For"]? // empty]
                 | flatten | index("{http.vars.client_ip}") != null' /tmp/caddy-adapted.json > /dev/null \
            || { echo "::error::reverse_proxy 에 X-Forwarded-For 덮어쓰기가 없습니다 — trusted_proxies 만으로는 CF 엣지 IP 가 그대로 남습니다"; exit 1; }
          # X-Forwarded-Proto·Host 도 함께 지킨다. 신뢰 프록시를 선언하면 Caddy 가 이 둘을 덮어쓰지 않고
          # 통과시키므로, 지워지면 클라이언트가 보낸 값이 그대로 톰캣의 스킴·getServerName() 이 된다.
          # caddy adapt 가 이 두 줄을 "Unnecessary" 라고 잘못 경고해 지워지기 쉬운 자리라 단언으로 못박는다.
          for forwarded_header in X-Forwarded-Proto X-Forwarded-Host; do
            jq -e --arg h "$forwarded_header" \
               '[.. | objects | .headers?.request?.set?[$h]? // empty] | flatten | length > 0' \
               /tmp/caddy-adapted.json > /dev/null \
              || { echo "::error::reverse_proxy 에 ${forwarded_header} 덮어쓰기가 없습니다 — 신뢰 프록시 선언 뒤에는 클라이언트가 보낸 값이 그대로 통과합니다"; exit 1; }
          done
          grep -qE '^\s*forward-headers-strategy:\s*native\s*$' backend/src/main/resources/application-prod.yml \
            || { echo "::error::application-prod.yml 에 forward-headers-strategy: native 가 없습니다 — 톰캣이 X-Forwarded-For 를 무시합니다"; exit 1; }
          echo "클라이언트 IP 복원 설정 확인 완료"
