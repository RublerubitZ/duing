name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *' # 04:15 KST

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Supabase CLI
        # 서드파티 액션 없이 공식 릴리스를 직접 받는다 — 운영 DB 자격을 쥔 잡에 들어오는 외부 코드를 CLI 하나로 줄이고,
        # 액션 런타임(Node) 폐기와 무관하게 둔다. 같은 릴리스의 checksums.txt 로 sha256 을 대조한 뒤 푼다.
        env:
          SUPABASE_CLI_VERSION: 2.117.0   # 메이저 변경 시 덤프 옵션이 조용히 깨지지 않게 핀(2026-09-24 latest). 올릴 때 workflow_dispatch 로 수동 실행해 확인
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 "$base/checksums.txt" | awk -v a="$asset" '$2 == a' > supabase.sha256
          sha256sum -c supabase.sha256   # 해당 줄이 없어 빈 파일이면 여기서 실패한다
          mkdir -p supabase-cli && tar -xzf "$asset" -C supabase-cli   # supabase·supabase-go 둘 다 필요 — 통째로 푼다
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"
          supabase-cli/supabase --version

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # 덤프용 postgres 이미지를 GHCR 에서 받는다 — 예전 setup-cli(v1.7.1)가 넣어 주던 값을 직접 설치로 바꾸며 명시로 옮겼다.
          # db dump 는 레지스트리 폴백 없이 이 주소 하나만 쓴다(폴백은 supabase start 전용). GHCR 스로틀로 pull 이 실패하면
          # 이 줄을 지워 CLI 기본 레지스트리(public.ecr.aws)로 옮긴다.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy \
            -x storage.buckets_vectors -x storage.vector_indexes -f backup/data.sql
          gzip backup/*.sql

      - name: Verify backup
        run: |
          gzip -t backup/*.sql.gz
          ls -lh backup/
          [ "$(stat -c%s backup/data.sql.gz)" -gt 10240 ] || { echo "data.sql.gz too small — dump likely failed"; exit 1; }

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2.23+ 기본 체크섬이 R2 미지원 — 필수
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp backup/ "s3://${{ secrets.R2_BUCKET }}/$(TZ=Asia/Seoul date +%Y/%m/%d)/" \
            --recursive --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      # 백업 실패는 사람이 며칠 뒤에야 알아채는 사고였다(2026-09-20 풀러 한도 점유). 서드파티 액션 없이
      # curl+jq 로 실패·취소 시에만 알린다 — 채널·형식은 deploy-backend.yml 의 배포 알림과 동일(deploy/MONITORING.md).
      # 알림 실패는 잡 결과를 바꾸지 않는다(항상 exit 0).
      - name: Notify Slack (backup failure)
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 백업 실패 알림 생략"
            exit 0
          fi
          case "$JOB_STATUS" in
            cancelled) ICON="⚪"; STATUS="CANCELLED" ;;
            *)         ICON="🔴"; STATUS="FAILURE (오늘 백업 없음 — 실행 로그 확인, 풀러 한도·시크릿·R2 순으로 점검)" ;;
          esac
          TEXT="$(printf '%s\n' \
            "${ICON} Database Backup" \
            "서비스: Duing" \
            "status: ${STATUS}" \
            "시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" \
            "실행: ${RUN_URL}")"
          PAYLOAD="$(jq -cn --arg text "$TEXT" '{text: $text}')"
          if ! curl -sS -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' \
               --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" 2>/dev/null; then
            echo "::warning::Slack 백업 실패 알림 전송 실패(잡 결과와 무관)"
          fi
          exit 0
