name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *' # 04:15 KST

# GITHUB_TOKEN 을 쓰는 스텝이 없다 — 운영 DB·R2 자격을 쥔 잡이라 토큰 권한을 모두 끈다(#1302).
permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Supabase CLI
        # 서드파티 액션 없이 공식 릴리스를 직접 받는다 — 운영 DB 자격을 쥔 잡에 들어오는 외부 코드를 CLI 하나로 줄이고,
        # 액션 런타임(Node) 폐기와 무관하게 둔다. 워크플로에 고정한 sha256 으로 대조한 뒤 푼다 — 같은 릴리스의
        # checksums.txt 와 비교하면 자산과 체크섬이 함께 바뀐 경우를 못 잡는다(#1302). 릴리스 자산이 바뀌면 여기서 실패한다.
        # 버전을 올릴 때 해시도 함께 바꾼다: gh api repos/supabase/cli/releases/tags/vX.Y.Z --jq
        #   '.assets[]|select(.name=="supabase_X.Y.Z_linux_amd64.tar.gz")|.digest' (앞의 "sha256:" 는 뗀다) 와
        #   checksums.txt 의 같은 줄을 교차 확인한다.
        env:
          SUPABASE_CLI_VERSION: 2.117.0   # 메이저 변경 시 덤프 옵션이 조용히 깨지지 않게 핀(2026-09-24 latest). 올릴 때 workflow_dispatch 로 수동 실행해 확인
          SUPABASE_CLI_SHA256: 69c05f85b9e47ee706d30f1a6ca8a526b4e337bfd12c7ef1ef522d24e7280d24   # 버전과 한 쌍 — 함께 바꾼다
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$asset" "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/$asset"
          echo "${SUPABASE_CLI_SHA256}  $asset" | sha256sum -c -
          mkdir -p supabase-cli && tar -xzf "$asset" -C supabase-cli   # supabase·supabase-go 둘 다 필요 — 통째로 푼다
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"
          supabase-cli/supabase --version

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # 덤프용 postgres 이미지를 GHCR 에서 받는다 — 예전 setup-cli(v1.7.1)가 넣어 주던 값을 직접 설치로 바꾸며 명시로 옮겼다.
          # db dump 는 레지스트리 폴백 없이 이 주소 하나만 쓴다(폴백은 supabase start 전용). GHCR 스로틀로 pull 이 실패하면
          # 이 줄을 지워 CLI 기본 레지스트리(public.ecr.aws)로 옮긴다.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy \
            -x storage.buckets_vectors -x storage.vector_indexes -f backup/data.sql
          gzip backup/*.sql

      - name: Verify backup
        run: |
          gzip -t backup/*.sql.gz
          ls -lh backup/
          [ "$(stat -c%s backup/data.sql.gz)" -gt 10240 ] || { echo "data.sql.gz too small — dump likely failed"; exit 1; }

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2.23+ 기본 체크섬이 R2 미지원 — 필수
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp backup/ "s3://${{ secrets.R2_BUCKET }}/$(TZ=Asia/Seoul date +%Y/%m/%d)/" \
            --recursive --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      # 백엔드 09:00 일간 요약(TrafficSurgeMonitor.BACKUP_JOB_KEY — 키를 바꾸면 두 곳을 함께 바꾼다)이 이 줄로 '마지막 백업
      # 성공'을 본다. 잡이 시작조차 못 한 날(계정 잠금·예약 누락·비활성)은 아래 실패 알림도 돌지 않아, 이 줄이 멈춘 것이 유일한
      # 신호다(C57). 입력 없는 고정 문장으로 한 행만 덮어쓴다. 덤프 롤을 분리하면(#1323) 그 롤에 public.scheduled_job_run
      # INSERT·UPDATE 권한이 필요하다.
      # 기록 실패는 백업 결과를 바꾸지 않는다 — psql 실패는 경고 주석만 남기고(이어서 빠지면 다음 요약이 '26시간 넘음'으로
      # 드러낸다), 걸리면 스텝 시간 상한 + continue-on-error 로 끊는다. 잠금·문장 상한은 트랜잭션 안 SET LOCAL 로 건다 — 풀러가
      # PGOPTIONS 를 넘기는지 불확실하고, 세션 SET 은 세션 풀러가 연결을 다음 클라이언트에 물려줄 때 남을 수 있다.
      # 공개 로그라 psql 출력은 버린다 — 연결 오류에 호스트·사용자 이름이 찍힌다.
      - name: Record backup success
        continue-on-error: true
        timeout-minutes: 2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: '10'
        run: |
          if psql -X -q -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" >/dev/null 2>&1 <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '5s';
          SET LOCAL statement_timeout = '15s';
          INSERT INTO public.scheduled_job_run (job_key, last_started_at, last_finished_at, last_outcome,
                  last_result_count, last_failed_count, last_succeeded_at, consecutive_unhealthy_runs)
          VALUES ('DB_BACKUP', now(), now(), 'SUCCESS', 0, 0, now(), 0)
          ON CONFLICT (job_key) DO UPDATE SET
                  last_started_at = EXCLUDED.last_started_at,
                  last_finished_at = EXCLUDED.last_finished_at,
                  last_outcome = EXCLUDED.last_outcome,
                  last_result_count = EXCLUDED.last_result_count,
                  last_failed_count = EXCLUDED.last_failed_count,
                  last_succeeded_at = EXCLUDED.last_succeeded_at,
                  consecutive_unhealthy_runs = EXCLUDED.consecutive_unhealthy_runs;
          COMMIT;
          SQL
          then
            echo "백업 성공 기록 완료(DB_BACKUP)"
          else
            echo "::warning::백업 성공 기록 실패 — 백업은 R2 에 올라갔다. 이어서 빠지면 09:00 일간 요약이 백업 경고를 띄운다(deploy/MONITORING.md)"
          fi

      # 백업 실패는 사람이 며칠 뒤에야 알아채는 사고였다(2026-09-20 풀러 한도 점유). 서드파티 액션 없이
      # curl+jq 로 실패·취소 시에만 알린다 — 채널·형식은 deploy-backend.yml 의 배포 알림과 동일(deploy/MONITORING.md).
      # 알림 실패는 잡 결과를 바꾸지 않는다(항상 exit 0).
      - name: Notify Slack (backup failure)
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 백업 실패 알림 생략"
            exit 0
          fi
          case "$JOB_STATUS" in
            cancelled) ICON="⚪"; STATUS="CANCELLED" ;;
            *)         ICON="🔴"; STATUS="FAILURE (오늘 백업 없음 — 실행 로그 확인, 풀러 한도·시크릿·R2 순으로 점검)" ;;
          esac
          TEXT="$(printf '%s\n' \
            "${ICON} Database Backup" \
            "서비스: Duing" \
            "status: ${STATUS}" \
            "시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" \
            "실행: ${RUN_URL}")"
          PAYLOAD="$(jq -cn --arg text "$TEXT" '{text: $text}')"
          if ! curl -sS -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' \
               --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" 2>/dev/null; then
            echo "::warning::Slack 백업 실패 알림 전송 실패(잡 결과와 무관)"
          fi
          exit 0
