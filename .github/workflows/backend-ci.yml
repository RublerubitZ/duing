name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile main + test sources
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Test (TestContainers — ubuntu-latest 내장 Docker 데몬 사용)
        run: ./gradlew test --no-daemon

      - name: Build (test 결과 재사용)
        run: ./gradlew build -x test --no-daemon

      - name: Upload test + build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-build-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7
