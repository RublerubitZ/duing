name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 로컬(KST) 과 CI(UTC) 의 시간 경계·윈도 차이로 알림/리마인더 잡 테스트가 깨지지 않게 KST 로 고정한다.
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile main + test sources
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Test (TestContainers — ubuntu-latest 내장 Docker 데몬 사용)
        run: ./gradlew test --no-daemon

      - name: Build (test 결과 재사용)
        run: ./gradlew build -x test --no-daemon

      - name: Upload test + build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7
