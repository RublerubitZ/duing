name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # PR 에서는 ci-gate.yml 이 변경 영역을 판정해 이 워크플로를 호출한다(workflow_call).
  # 여기에 pull_request 트리거를 되살리면 게이트 호출분과 이중 실행되므로 두지 않는다.
  # 스택 PR(앞 PR 을 base 로 삼는 후속 PR)도 게이트가 base 브랜치를 가리지 않아 그대로 검사된다.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile main + test sources
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Pre-pull Testcontainers images (백오프 재시도)
        # docker.io 익명 pull 이 공용 러너에서 간헐적으로 레이트리밋/지연되어 ryuk 이미지 pull 이
        # 2분 타임아웃 → 수트 전체(523건)가 연쇄 실패한 사례 대응 (run 27337340457, PR #345).
        # 이미지 확보를 테스트 실행과 분리하고, 일시 장애는 백오프 재시도로 흡수하며,
        # 최종 실패 시 어떤 이미지가 문제인지 명확히 드러낸다.
        # 이미지 태그 출처: postgres → TestcontainersConfiguration.java, minio → S3FileStorageIntegrationTest.java
        run: |
          set -euo pipefail
          pull_with_retry() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker pull "$image"; then return 0; fi
              echo "::warning::이미지 pull 실패 ($image, attempt $attempt/3) — $((attempt * 20))s 백오프 후 재시도"
              sleep $((attempt * 20))
            done
            echo "::error::이미지 pull 최종 실패: $image"
            return 1
          }
          pull_with_retry postgres:16-alpine
          pull_with_retry minio/minio:RELEASE.2025-09-07T16-13-09Z

      - name: Test (TestContainers — ubuntu-latest 내장 Docker 데몬 사용)
        env:
          # 일회용 CI 러너에서는 컨테이너 리퍼(ryuk)가 불필요 — job 종료와 함께 러너가 폐기된다.
          # ryuk 이미지 pull 을 제거해 위 사례의 단일 실패점을 없앤다. 로컬 개발은 기본값(활성) 유지.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./gradlew test --no-daemon

      - name: Build (test 결과 재사용)
        run: ./gradlew build -x test --no-daemon

      - name: Upload test + build reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-build-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7
