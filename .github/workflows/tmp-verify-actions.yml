# 임시 검증 워크플로 — PR(ci/node24-action-runtimes) 머지 전에 삭제한다.
# backup.yml·deploy-backend.yml 은 PR CI(Gate)가 돌리지 않으므로, 바뀐 CLI 설치·덤프 경로와 이미지 빌드 경로를
# 이 브랜치 push 에서만 ubuntu-24.04·26.04 두 러너로 한 번 돌려 본다.
# 저장소 시크릿은 쓰지 않는다(공개 로그) — DB 는 잡 안의 일회용 postgres, 레지스트리 로그인은 자동 GITHUB_TOKEN 뿐이다.
name: TMP Verify Actions

on:
  push:
    branches: [ci/node24-action-runtimes]

permissions:
  contents: read
  packages: read

jobs:
  backup-dump:
    name: Backup dump (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: verify # 일회용 더미 — 잡과 함께 사라진다
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:verify@localhost:5432/postgres

    steps:
      - name: Install Supabase CLI
        # 서드파티 액션 없이 공식 릴리스를 직접 받는다 — 운영 DB 자격을 쥔 잡에 들어오는 외부 코드를 CLI 하나로 줄이고,
        # 액션 런타임(Node) 폐기와 무관하게 둔다. 같은 릴리스의 checksums.txt 로 sha256 을 대조한 뒤 푼다.
        env:
          SUPABASE_CLI_VERSION: 2.117.0   # 메이저 변경 시 덤프 옵션이 조용히 깨지지 않게 핀(2026-09-24 latest). 올릴 때 workflow_dispatch 로 수동 실행해 확인
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 "$base/checksums.txt" | awk -v a="$asset" '$2 == a' > supabase.sha256
          sha256sum -c supabase.sha256   # 해당 줄이 없어 빈 파일이면 여기서 실패한다
          mkdir -p supabase-cli && tar -xzf "$asset" -C supabase-cli   # supabase·supabase-go 둘 다 필요 — 통째로 푼다
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"
          supabase-cli/supabase --version

      - name: Seed
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "create table public.tmp_verify (id int primary key, note text); insert into public.tmp_verify values (1, 'a'), (2, 'b');"

      - name: Dump (backup.yml 과 같은 명령)
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy \
            -x storage.buckets_vectors -x storage.vector_indexes -f backup/data.sql
          gzip backup/*.sql

      - name: Assert
        run: |
          set -euo pipefail
          gzip -t backup/*.sql.gz
          ls -lh backup/
          zcat backup/data.sql.gz > "$RUNNER_TEMP/data.sql"
          grep -qE '^COPY "?public"?\."?tmp_verify"?' "$RUNNER_TEMP/data.sql" \
            || { echo "::error::data.sql 에 tmp_verify COPY 블록이 없다"; exit 1; }
          repos="$(docker image ls --format '{{.Repository}}')"
          grep -qx 'ghcr.io/supabase/postgres' <<<"$repos" \
            || { echo "::error::덤프 이미지가 ghcr.io 에서 오지 않았다"; echo "$repos"; exit 1; }
          echo "덤프 3종·COPY 블록·GHCR 출처 확인"

  docker-build:
    name: Docker build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push 없음)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ghcr.io/rublerubitz/duing-backend:tmp-verify
          # 운영과 같은 gha 캐시 경로를 쓴다 — cache-from 실패는 비치명 경고라 cache-to 까지 있어야 캐시 환경 이상이 드러난다.
          # scope 를 매트릭스별로 나눠 두 잡이 같은 scope 에 동시에 쓰지 않게 하고, 검증 후 gh cache delete 로 지운다.
          cache-from: type=gha,scope=tmp-verify-${{ matrix.os }}
          cache-to: type=gha,mode=max,scope=tmp-verify-${{ matrix.os }}
