name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # PR 에서는 ci-gate.yml 이 변경 영역을 판정해 이 워크플로를 호출한다(workflow_call).
  # 여기에 pull_request 트리거를 되살리면 게이트 호출분과 이중 실행되므로 두지 않는다.
  # 스택 PR(앞 PR 을 base 로 삼는 후속 PR)도 게이트가 base 브랜치를 가리지 않아 그대로 검사된다.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Enable Corepack & activate pnpm
        # pnpm/action-setup 의존 제거 — Node 내장 corepack 이 pnpm 설치/활성화. codeload SHA 캐시 미스 우회.
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dependency rules
        run: pnpm depcruise

      - name: Analytics event audit
        run: pnpm audit:analytics

      - name: Build
        env:
          # 운영 API URL fail-fast(#634) 통과용 CI 전용 https URL — 실서버 아님
          NEXT_PUBLIC_API_BASE_URL: https://api.ci.invalid/api/v1
          # 쿠키 인증 힌트(#636) 빌드용 CI 전용 값 — 시크릿 아님
          AUTH_HINT_SECRET: ci-only-auth-hint-secret-at-least-32-bytes
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
