name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect scaffolding
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f apps/web/package.json ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pnpm-lock.yaml 또는 apps/web/package.json 이 아직 없어 빌드 단계를 스킵합니다. 첫 'pnpm install' 후 lockfile 을 커밋하면 활성화됩니다."
          fi

      - name: Enable Corepack & activate pnpm
        if: steps.detect.outputs.scaffolded == 'true'
        # pnpm/action-setup 의존 제거 — Node 내장 corepack 이 pnpm 설치/활성화. codeload SHA 캐시 미스 우회.
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Set up Node.js 20
        if: steps.detect.outputs.scaffolded == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.scaffolded == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.scaffolded == 'true'
        run: pnpm lint

      - name: Build
        if: steps.detect.outputs.scaffolded == 'true'
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.ci.invalid/api/v1
        run: pnpm build

      - name: Type check
        if: steps.detect.outputs.scaffolded == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.detect.outputs.scaffolded == 'true'
        run: pnpm test
