spring:
  config:
    # 운영용 .env 자동 import 비활성화 — 테스트 격리.
    import: ""
  profiles:
    active: test
  datasource:
    # Testcontainers JDBC URL scheme — driver 가 컨테이너를 자동 기동.
    # @Import(TestcontainersConfiguration.class) 가 있는 테스트는 @ServiceConnection 이
    # 이 url 을 덮어쓰므로 동일 image 컨테이너를 단 1회만 띄운다. 본 url 은 @Import 누락 시의 fallback.
    url: jdbc:tc:postgresql:16-alpine:///duing_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # Testcontainers 가 매 실행마다 새로 만드는 임시 컨테이너의 더미 자격 — 실 시크릿 아님.
    username: test
    password: test
    hikari:
      # 동시성 테스트(10 스레드)가 스레드당 연결을 트랜잭션 내내 점유해도 여유를 두기 위해
      # 풀 크기를 스레드 수보다 크게(20) 잡는다. 풀==스레드면 부수적 연결 사용 시 60s 풀 획득
      # 타임아웃으로 빠져 플래키해진다. 테스트 전용 설정으로, 운영(application-prod) 풀은 건드리지 않는다.
      maximum-pool-size: 20
      # minimum-idle 기본값은 maximum-pool-size 와 같아, 전체 스위트의 여러 Spring 컨텍스트가
      # 각각 20개 유휴 커넥션을 쟁여두면 단일 Testcontainers Postgres 의 max_connections 를 넘겨
      # "too many clients already" 로 무관한 통합테스트가 컨텍스트 로드에 실패한다. 유휴 점유를 1로
      # 낮춰 컨텍스트당 상시 점유를 최소화하고, 버스트는 max(20)까지 온디맨드로 확장한다.
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

file:
  storage:
    provider: stub

mo:
  provider: stub
  inbound-number: "16663538"
  stub:
    auto-verify-after-seconds: 0

phone-verification:
  # 테스트 전용 더미 키 — 실 시크릿 아님.
  secret: duing-test-phone-verification-secret

octomo:
  # 테스트 전용 더미 — mo.provider=stub 이라 실제 호출·바인딩은 없다 (OctomoClientConfig 는 octomo 일 때만 활성).
  api-key: ""
  base-url: http://localhost:0/octomo-stub

bank-api:
  # 테스트 전용 더미 baseUrl — @NotBlank fail-fast 충족용. 실제 호출은 발생하지 않는다.
  # 통합테스트는 BankApiClient 를 @Primary stub 으로 대체하므로 이 URL 로 나가는 외부 호출이 없다.
  base-url: http://localhost:0/bank-api-stub
  api-key: ""
  secret-key: ""

jwt:
  secret: duing-test-jwt-secret-key-that-is-long-enough-for-hs256-algorithm
  expiry-ms: 3600000

web-auth:
  hint-secret: duing-test-auth-hint-secret-key-that-is-different-from-jwt

security:
  fee-account:
    # 테스트 전용 더미 키 — 실 시크릿 아님. base64("duing-test-fee-account-aes256-ke") = 32바이트 AES-256 키.
    encryption-key: ZHVpbmctdGVzdC1mZWUtYWNjb3VudC1hZXMyNTYta2U=

duing:
  notification:
    jobs:
      enabled: false
  fee:
    overdue:
      enabled: false
    auto-issue:
      enabled: false
  privacy:
    retention:
      enabled: false
      window: P1Y
  federation-inquiry:
    purge:
      enabled: false
      window: P45D
  public-activity:
    window-days: 30
    default-limit: 10
    max-limit: 20
  facility:
    crawler:
      enabled: false
      # 테스트 전용 더미 baseUrl — 온디맨드 fetch 는 신선한 스냅샷을 시드해 캐시히트로 우회하므로 실제 호출 없음.
      base-url: http://localhost:0/facility-stub
      list-path: /room/detail
      data-path: /room/data/list
      user-agent: DuingFacilityTest/1.0
      connect-timeout-millis: 500
      read-timeout-millis: 500
      retry-max-attempts: 4
      retry-backoff-millis: 1
      on-demand-retry-max-attempts: 2
      on-demand-deadline-seconds: 10
      room-delay-millis: 1
