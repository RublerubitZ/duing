# 운영은 LB/프록시 뒤 — 톰캣 RemoteIpValve 가 신뢰 프록시(사설망)에서 온 X-Forwarded-For 만
# getRemoteAddr 에 반영한다. 직접 클라이언트가 보낸 위조 XFF 는 무시되어 IP 레이트리밋 우회를 막는다.
server:
  forward-headers-strategy: native

# 운영 CORS 허용 Origin — default 없이 주입한다. 누락 시 부팅이 실패(fail-fast)하여 잘못된
# localhost 폴백을 차단한다. SecurityConfig 의 @Value 기본값(http://localhost:3000)은 로컬/테스트
# 전용이며, 운영에서는 이 값이 우선하므로 CORS_ALLOWED_ORIGINS 가 비면 기동되지 않는다.
# (allowCredentials=true 환경) 여러 Origin 은 콤마로 구분: https://duings.com,https://www.duings.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

web-auth:
  hint-cookie-domain: ${AUTH_HINT_COOKIE_DOMAIN}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Supabase Supavisor(세션 풀러, :5432) 를 공유하므로 연결 예산을 보수적으로 잡는다.
    # 풀 크기는 DB_POOL_MAX_SIZE 로 주입(기본 10) — Supabase 플랜의 풀러 연결 한도와 Flyway·관리도구·
    # 향후 레플리카 몫까지 감안해 한도 안에서 정한다(레플리카 N 대면 인스턴스당 한도÷N). 한 노브로
    # maximum-pool-size 와 minimum-idle 을 같게 둬 고정 풀(fixed pool) 로 운영 — 유휴 시에도 연결 수를
    # 일정하게 유지해 풀러가 보는 연결 수를 예측 가능하게 한다(HikariCP 권장 구성).
    # max-lifetime: 기존 280초는 "풀러 idle 타임아웃 회피" 목적의 보수값이었으나, idle 은 keepalive-time
    # 60초가 이미 방어하고, 재접속(TLS 핸드셰이크 + 세션 초기화 문장 6개)이 일 ~3,000회 발생해 Supabase
    # egress 의 주요 요인이었다(2026-08 egress 감사). Supavisor 세션 모드에 문서화된 서버측 수명 종료는
    # 없어 단계 상향한다: 600s(현재, 재접속 일 ~1,440회) → 관찰 후 .env 의 DB_MAX_LIFETIME_MS 로
    # 1200s → 1800s. connection reset/SQLState 08* 이 늘면 직전 안정값으로 되돌린다.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 30000
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
      keepalive-time: 60000
      leak-detection-threshold: 60000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # 운영에서는 운영 마이그레이션만 적용한다. application-local.yml 의 migration-dev 는 포함되지 않으므로
    # 로컬 시드(V12~) 가 운영 DB 로 흘러 들어가지 않는다.
    locations: classpath:db/migration

# API 문서(Swagger UI / OpenAPI JSON)는 운영에서 비활성화한다. SecurityConfig 가 /swagger-ui/**,
# /v3/api-docs/** 를 permitAll 로 열어두므로, 운영에 노출되면 전체 엔드포인트·요청 스키마가 인증 없이
# 공개되어 공격 표면 정찰에 악용된다. springdoc 을 끄면 두 경로 모두 404 가 되어 문서가 노출되지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

duing:
  # 만료/폐기 세션·감사 로그 정리 잡 — 운영 기본 활성(삭제 대상이 만료 데이터뿐이라 안전).
  # 별도 env 셋업 누락으로 조용히 꺼지는 사고를 막기 위해 프로파일에서 하드코딩한다.
  # DUING_AUTH_SESSION_CLEANUP_ENABLED=false 로 끌 수 있다.
  auth:
    session:
      cleanup:
        enabled: ${DUING_AUTH_SESSION_CLEANUP_ENABLED:true}
  # 알림 스케줄러 — 운영에서는 항상 켜져있어야 한다.
  # 별도 환경변수 셋업을 잊는 사일런트 결손을 막기 위해 프로파일에서 하드코딩한다.
  # 끄고 싶으면 DUING_NOTIFICATION_JOBS_ENABLED=false 로 env var 오버라이드 가능.
  notification:
    jobs:
      enabled: ${DUING_NOTIFICATION_JOBS_ENABLED:true}
      retention:
        # 알림 30일 파기 잡도 다른 잡들과 동일한 하드코딩 관례로 운영 기본 활성화한다. base
        # application.yml 기본값은 false 라 지금까지 이 오버라이드가 없어 prod 에서 조용히 꺼져
        # 있었다(운영 갭) — 문의 알림(dedupKey FEDERATION_INQUIRY_*) 등의 제목이 notification body 에
        # 무기한 잔존하는 문제를 이 활성화로 봉합한다. DUING_NOTIFICATION_RETENTION_ENABLED=false 로 끌 수 있다.
        enabled: ${DUING_NOTIFICATION_RETENTION_ENABLED:true}
  # 개인정보 처리방침의 45일 보관/파기 잡을 운영에서만 활성화한다. base application.yml 기본값은 false
  # (로컬은 꺼짐) 이고 여기서만 켜서 운영 DB 의 soft-delete PII 가 45일 후 비식별화/삭제되게 한다.
  # DUING_PII_RETENTION_ENABLED=false 로 끌 수 있다.
  privacy:
    retention:
      enabled: ${DUING_PII_RETENTION_ENABLED:true}
  # 삭제된 총동연 문의 본문·첨부 파기 잡 — 다른 파기 잡들과 동일한 하드코딩 관례로 운영 기본
  # 활성화한다. DUING_FEDERATION_INQUIRY_PURGE_ENABLED=false 로 끌 수 있다.
  federation-inquiry:
    purge:
      enabled: ${DUING_FEDERATION_INQUIRY_PURGE_ENABLED:true}
  # 추천순 활동점수 집계 잡 — 운영 기본 활성(집계 upsert 만이라 안전, 꺼지면 추천 정렬이 활동점수 0 으로
  # 저하 동작한다). 다른 잡들과 동일한 하드코딩 관례. DUING_CLUB_METRIC_ENABLED=false 로 끌 수 있다.
  club:
    metric:
      enabled: ${DUING_CLUB_METRIC_ENABLED:true}
  # 시설 크롤 스케줄러 — 운영에서는 항상 켠다. 별도 env 셋업 누락으로 조용히 꺼지는 사고를 막는다.
  # 끄고 싶으면 DUING_FACILITY_CRAWLER_ENABLED=false 로 오버라이드한다.
  facility:
    crawler:
      enabled: ${DUING_FACILITY_CRAWLER_ENABLED:true}
    booking:
      matching:
        # APPROVED → CONFIRMED 자동 매칭 잡 — 운영은 항상 켠다(크롤 스케줄러와 동일 관례).
        # 끄고 싶으면 DUING_FACILITY_BOOKING_MATCHING_ENABLED=false 로 오버라이드한다.
        enabled: ${DUING_FACILITY_BOOKING_MATCHING_ENABLED:true}

# MO 인증 — 운영 기본은 실조회(octomo). stub 으로 남으면 인증이 영영 완료되지 않는 조용한 장애가 된다.
mo:
  provider: ${MO_PROVIDER:octomo}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

# 운영 Sentry — DSN 을 폴백 없이 주입(누락 시 fail-fast). 모니터링이 조용히 꺼진 채 배포되는
# 사일런트 결손을 막는다(CORS 등 다른 운영 필수값과 동일 정책). 의도적으로 끄려면 빈 값을 준다.
sentry:
  dsn: ${SENTRY_DSN}
  environment: production

file:
  storage:
    provider: s3

# 환경변수는 vendor(R2) 가 아니라 provider-neutral 한 S3_* 로 통일한다 — 내부 프로퍼티가
# s3.*, 구현체가 S3FileStorageService 이고 로컬 개발도 같은 S3_* 를 쓰므로 환경 불문 동일
# 변수명, 값(버킷/엔드포인트)만 환경별로 다르게 주입. default 없음 = credential 누락 시 fail-fast.
s3:
  endpoint: ${S3_ENDPOINT}
  region: auto
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET:duing}
  public-base-url: ${S3_PUBLIC_BASE_URL}
