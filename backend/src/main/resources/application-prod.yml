spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # 운영에서는 운영 마이그레이션만 적용한다. application-local.yml 의 migration-dev 는 포함되지 않으므로
    # 로컬 시드(V12~) 가 운영 DB 로 흘러 들어가지 않는다.
    locations: classpath:db/migration

# 알림 스케줄러 — 운영에서는 항상 켜져있어야 한다.
# 별도 환경변수 셋업을 잊는 사일런트 결손을 막기 위해 프로파일에서 하드코딩한다.
# 끄고 싶으면 DUING_NOTIFICATION_JOBS_ENABLED=false 로 env var 오버라이드 가능.
duing:
  notification:
    jobs:
      enabled: ${DUING_NOTIFICATION_JOBS_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

file:
  storage:
    provider: s3

s3:
  endpoint: ${R2_ENDPOINT}
  region: auto
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET:duing}
  public-base-url: https://files.duing.app
