spring:
  config:
    # backend/.env 파일을 Spring property source 로 자동 로드 (없으면 무시).
    # KEY=VALUE 형식이 그대로 .properties 와 호환됨.
    import: optional:file:.env[.properties]
  profiles:
    active: local
  application:
    name: duing
  servlet:
    multipart:
      # 이미지 업로드 정책 한도는 FileUploadPolicy.MAX_BYTES (5MB). 서블릿 한도는
      # 그보다 큰 값을 두어 5MB 초과 파일도 우리 검증(FileController.validate)이 먼저
      # 받아 한국어 400 메시지를 내려준다. ClubPhoto 등 향후 다른 업로드까지 감안해 10MB.
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiry-ms: ${JWT_EXPIRY_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/duing/uploads}
  storage:
    provider: ${FILE_STORAGE_PROVIDER:local}   # local | s3  (test 전용: stub)

s3:
  endpoint: ${S3_ENDPOINT:}
  region: ${S3_REGION:auto}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  bucket: ${S3_BUCKET:duing}
  public-base-url: ${S3_PUBLIC_BASE_URL:}

email:
  provider: ${EMAIL_PROVIDER:logging}   # logging | resend  (test 전용: stub)
  verification:
    secret: ${EMAIL_VERIFICATION_SECRET}   # HMAC 키 — 기본값 없음(필수), .env 로 주입

resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM:Du-ing <noreply@duings.com>}

duing:
  notice:
    cover-image-url-prefix: ${NOTICE_COVER_IMAGE_URL_PREFIX:}
  notification:
    jobs:
      enabled: ${DUING_NOTIFICATION_JOBS_ENABLED:false}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
