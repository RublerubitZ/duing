spring:
  config:
    # backend/.env 파일을 Spring property source 로 자동 로드 (없으면 무시).
    # KEY=VALUE 형식이 그대로 .properties 와 호환됨.
    import: optional:file:.env[.properties]
  profiles:
    active: local
  application:
    name: duing
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiry-ms: ${JWT_EXPIRY_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/duing/uploads}
  storage:
    provider: ${FILE_STORAGE_PROVIDER:local}   # local | supabase

supabase:
  storage:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:duing}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
