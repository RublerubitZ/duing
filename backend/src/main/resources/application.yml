server:
  tomcat:
    # 서블릿 멀티파트 한도(아래 max-file-size 10MB) 초과 시 Tomcat 은 본문을 읽기 전에 413 을
    # 만들지만, 남은 요청 본문을 다 흘려보내야 응답이 클라이언트에 도달한다. 기본 max-swallow-size
    # (2MB) 로는 커넥션을 끊어버려 413 대신 네트워크 오류로 보인다. 엣지 캡(deploy/Caddyfile 의
    # request_body max_size 11MB)이 스왈로 상한을 잡아주므로 그 값에 맞춘다 — 두 값은 함께 움직여야 한다.
    max-swallow-size: 11MB

spring:
  config:
    # backend/.env 파일을 Spring property source 로 자동 로드 (없으면 무시).
    # KEY=VALUE 형식이 그대로 .properties 와 호환됨.
    import: optional:file:.env[.properties]
  profiles:
    active: local
  application:
    name: duing
  task:
    scheduling:
      pool:
        # 기본 1스레드는 크롤(최대 수 분)이 스케줄러를 점유하면 매칭의 3분 오프셋과 타 도메인 잡이
        # 함께 밀린다(2026-07-17 감사). 잡별 중복 실행은 각 스케줄러의 AtomicBoolean 가드가 막는다.
        size: 4
  servlet:
    multipart:
      # 이미지 업로드 정책 한도는 FileUploadPolicy.MAX_BYTES (5MB). 서블릿 한도는
      # 그보다 큰 값을 두어 5MB 초과 파일도 우리 검증(FileController.validate)이 먼저
      # 받아 한국어 413 메시지를 내려준다. ClubPhoto 등 향후 다른 업로드까지 감안해 10MB.
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      # V112(타임존 2단계 -9h 백필) 가드. +9h 왜곡은 JVM=UTC 인 운영에만 쌓였으므로 기본은 no-op 이고,
      # application-prod.yml 만 true 로 켠다. Flyway 체크섬은 치환 전 원문 기준이라 환경 간 불일치가 없다.
      apply_tz_backfill: "false"

# Actuator — 종합 health와 liveness/readiness probe만 외부에 노출한다.
# info·metrics·env·beans 등 다른 endpoint는 web exposure에서 제외하고, 공개 health 응답은
# show-details=never로 DB·디스크·오류 메시지 등 내부 상태를 숨긴다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"
  health:
    mail:
      # spring-boot-starter-mail 제거(PR5) 후 이 키는 무해한 잔존 설정이다. 굳이 지우지 않는 이유:
      # 구 이미지로 롤백하면 JavaMailSender 헬스체크가 되살아나 배포가 롤백 루프에 빠진 전례가 있다.
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiry-ms: ${JWT_EXPIRY_MS:1800000}

web-auth:
  hint-secret: ${AUTH_HINT_SECRET}
  hint-cookie-domain: ${AUTH_HINT_COOKIE_DOMAIN:}

# 회비 계좌번호 AES-256-GCM 암호화 키. base64 인코딩된 32바이트(256bit) 값을 FEE_ACCOUNT_ENC_KEY 환경변수로 주입한다.
# 기본값 없음(빈 문자열) — 키 미주입 시 FeeAccountCipher 가 기동 시점에 실패한다(fail fast). 운영은 env var 필수, yml/코드에 실키 금지.
security:
  fee-account:
    encryption-key: ${FEE_ACCOUNT_ENC_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Sentry — 에러 모니터링. SENTRY_DSN 이 없으면(local/test) 자동 비활성이라 이벤트를 전송하지 않는다.
# logback ERROR 레벨만 이벤트로 보낸다 → GlobalExceptionHandler.handleUnexpected 의 5xx 만 잡히고
# 4xx(검증·권한·낙관적/비관적 잠금)는 log.warn 이라 전송되지 않아 알림 노이즈가 없다.
# send-default-pii=false: 요청 바디·헤더·쿠키·IP 등 개인정보를 이벤트에 자동 첨부하지 않는다(PII 보호).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# Slack 운영 알림(Incoming Webhook) — 주요 비즈니스 이벤트(회원가입·동아리·회비·시설·관리자 조치)를
# 운영 채널로 보낸다. 로그 집계·Sentry 복제가 아니다(deploy/MONITORING.md). 빈 값이면 완전 비활성(로컬·CI).
# 전송은 커밋 후(@TransactionalEventListener AFTER_COMMIT) 전용 스레드에서 하며, 실패해도 서비스에 영향이 없다.
monitoring:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/duing/uploads}
  storage:
    provider: ${FILE_STORAGE_PROVIDER:local}   # local | s3  (test 전용: stub)

s3:
  endpoint: ${S3_ENDPOINT:}
  region: ${S3_REGION:auto}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  bucket: ${S3_BUCKET:duing}
  public-base-url: ${S3_PUBLIC_BASE_URL:}

# MO(문자 발신) 인증 — 사용자가 Octomo 대표번호로 인증코드를 문자 전송하면 exists 조회 API 로 확인한다.
mo:
  provider: ${MO_PROVIDER:stub}       # stub(로컬·CI — Octomo 미호출) | octomo(실조회)
  inbound-number: "16663538"          # 수신 대표번호(1666-3538) — 안내 문구·딥링크·QR 본문용
  # Octomo 일일 자체 상한 — 80% 도달 시 조기 경보(ERROR). 피크(모집 시즌) 상향은 반드시
  # 벤더 플랜(Free 월 1만 콜) 상향과 세트로만 — 상한만 올리면 월 쿼터가 며칠에 소진된다.
  daily-call-limit: ${MO_DAILY_CALL_LIMIT:1000}
  stub:
    # 양수(N)면 stub 이 최초 조회 후 N초 지난 세션을 수신된 것으로 간주 — 로컬 수동 플로우 확인용. 0 = 비활성.
    auto-verify-after-seconds: ${MO_STUB_AUTO_VERIFY_AFTER_SECONDS:0}

phone-verification:
  secret: ${PHONE_VERIFICATION_SECRET}   # 코드 파생 HMAC 키 — 기본값 없음(필수), .env 로 주입

# Octomo(octoverse.kr) MO 조회 — mo.provider=octomo 일 때만 활성. 키는 환경변수로만 주입.
octomo:
  api-key: ${OCTOMO_API_KEY:}
  base-url: https://api.octoverse.kr

# BANK API(bankapi.co.kr) 연동 — 회비 자동매칭의 거래내역 조회용(POST /v1/transactions).
# 제공사에 계좌 등록 절차는 없다 — 키만 있으면 바로 조회하며, 자동매칭 허용 동아리는 DB 설정으로 관리한다.
# 인증은 Bearer {api-key}:{secret-key} 헤더. 키는 환경변수로만 주입하고 yml/코드에 실키 금지.
# 키 미설정(빈 값) 시 거래 동기화만 401 로 실패하며 그 외 기동에는 영향이 없다.
bank-api:
  base-url: https://api.bankapi.co.kr
  api-key: ${BANK_API_KEY:}
  secret-key: ${BANK_API_SECRET:}

duing:
  auth:
    refresh:
      # opaque 리프레시 토큰 수명(일) — sliding, rotation 마다 연장. auth_hint 쿠키 수명도 이 값에 정렬.
      ttl-days: ${DUING_AUTH_REFRESH_TTL_DAYS:30}
      # rotation 직후 구토큰 재제시를 '동시 탭'으로 간주하는 창(초) — 운영 튜닝 노브 (spec §11).
      # 오탐(멀티탭 세션 폐기)이 보이면 넓히고, 안정되면 좁힌다. 코드 상수 아님.
      reuse-grace-seconds: ${DUING_AUTH_REFRESH_REUSE_GRACE_SECONDS:30}
    session:
      # 사용자당 동시 세션 상한 — 초과 로그인 시 LRU 자동 폐기 (spec §13).
      max-concurrent: ${DUING_AUTH_SESSION_MAX_CONCURRENT:5}
      cleanup:
        # 만료/폐기 세션·감사 로그 물리 삭제 잡(매일 04:50 Asia/Seoul). 기본 비활성 —
        # 운영은 application-prod.yml 에서 기본 활성(만료 데이터 삭제만이라 안전).
        enabled: ${DUING_AUTH_SESSION_CLEANUP_ENABLED:false}
  request:
    # 비멀티파트(JSON 등) 요청 바디 상한(바이트, 기본 2MB). RequestBodySizeLimitFilter 가 Content-Length 로
    # 확인해 초과 시 413 을 반환한다. 멀티파트 업로드는 제외(서블릿 multipart 한도·업로드 정책이 별도 강제).
    # 운영 엣지(Caddy request_body max_size 11MB)가 1차 방어이며, 이 값은 앱 레이어 심층 방어다.
    max-body-bytes: ${DUING_REQUEST_MAX_BODY_BYTES:2097152}
  notice:
    cover-image-url-prefix: ${NOTICE_COVER_IMAGE_URL_PREFIX:}
  notification:
    jobs:
      enabled: ${DUING_NOTIFICATION_JOBS_ENABLED:false}
      retention:
        # 30일 경과 개인 알림 파기 잡(매일 05:00 Asia/Seoul). 기본 비활성 —
        # 운영에서 DUING_NOTIFICATION_RETENTION_ENABLED=true 주입 시 활성화한다(스케줄링도 켜져 있어야 동작).
        enabled: ${DUING_NOTIFICATION_RETENTION_ENABLED:false}
  fee:
    overdue:
      # 회비 연체 전이 크론(매일 00:10 Asia/Seoul) — 마감 지난 PENDING·PARTIAL_PAID 청구를 OVERDUE 로 전이.
      # 기본 비활성 — 운영에서 DUING_FEE_OVERDUE_ENABLED=true 주입 시 활성화한다.
      enabled: ${DUING_FEE_OVERDUE_ENABLED:false}
    auto-issue:
      # 회비 자동 월발행 크론(매일 00:20 Asia/Seoul) — MONTHLY auto_issue 정책의 그 달 청구를 자동 발행.
      # 기본 비활성 — 운영에서 DUING_FEE_AUTO_ISSUE_ENABLED=true 주입 시 활성화한다.
      enabled: ${DUING_FEE_AUTO_ISSUE_ENABLED:false}
    reminder:
      # 회비 마감 임박 리마인더 크론(매일 06:00 Asia/Seoul) — D-3/D-1/D-0 미납 청구의 회원에게 FEE_BILL_DUE_SOON 인앱 알림.
      # 기본 비활성 — 운영에서 DUING_FEE_REMINDER_ENABLED=true 주입 시 활성화한다.
      enabled: ${DUING_FEE_REMINDER_ENABLED:false}
  federation-inquiry:
    purge:
      # 삭제된 총동연 1:1 문의 본문·첨부 파기 잡(매일 04:40 Asia/Seoul). 보관기간 = 45일(P45D) —
      # 개인정보 처리방침의 45일 보관을 준용(privacy.retention 과 동일 window). 기본 비활성 —
      # 운영에서 DUING_FEDERATION_INQUIRY_PURGE_ENABLED=true 주입 시 활성화한다.
      enabled: ${DUING_FEDERATION_INQUIRY_PURGE_ENABLED:false}
      window: ${DUING_FEDERATION_INQUIRY_PURGE_WINDOW:P45D}
  upload:
    purge:
      # 업로드 고아 객체 정리 잡(매시 :20 Asia/Seoul, #791). 업로드 후 24시간(PT24H) 넘게 어떤 엔티티에도 연결되지
      # 않은 객체를 스토리지에서 지운다. enabled 는 스케줄링, delete-enabled 는 실삭제 — 기본 둘 다 비활성.
      # 운영에서 DUING_UPLOAD_PURGE_ENABLED=true 로 켜고, dry-run(delete-enabled=false)으로 후보 로그를 확인한 뒤
      # DUING_UPLOAD_PURGE_DELETE_ENABLED=true 로 실삭제를 연다.
      enabled: ${DUING_UPLOAD_PURGE_ENABLED:false}
      delete-enabled: ${DUING_UPLOAD_PURGE_DELETE_ENABLED:false}
      window: ${DUING_UPLOAD_PURGE_WINDOW:PT24H}
  club:
    metric:
      # 추천순 활동점수 집계 잡(매시 정각 Asia/Seoul — bucket 전환과 동기화 + 기동 직후 1회). 기본 비활성 —
      # 운영에서 DUING_CLUB_METRIC_ENABLED=true(application-prod.yml)로 활성화한다.
      # 비활성이어도 추천 정렬은 활동점수 0 으로 동작한다(fail-open).
      # 같은 잡이 홈 관심도 집계(club_metric.interest_score)와 원천 이벤트 보존 정리(club_view_event
      # 8일 초과분 삭제)도 겸한다 — 비활성 환경에서는 관심도가 0 으로 고정되고 조회 이벤트가 쌓이기만
      # 한다. 운영에서 이 플래그를 끄면 보존 기간 약속이 지켜지지 않으므로 끄지 말 것.
      enabled: ${DUING_CLUB_METRIC_ENABLED:false}
  privacy:
    retention:
      # 탈퇴/폐쇄로 soft-delete 된 PII 의 보관기간 = 45일(P45D). 이후 파기 잡이 비식별화/삭제한다.
      # 기본 비활성 — 운영에서 DUING_PII_RETENTION_ENABLED=true 주입 시 활성화(개인정보 처리방침의 45일 보관과 일치).
      enabled: ${DUING_PII_RETENTION_ENABLED:false}
      window: ${DUING_PII_RETENTION_WINDOW:P45D}
  public-activity:
    window-days: ${DUING_PUBLIC_ACTIVITY_WINDOW_DAYS:30}
    default-limit: ${DUING_PUBLIC_ACTIVITY_DEFAULT_LIMIT:10}
    max-limit: ${DUING_PUBLIC_ACTIVITY_MAX_LIMIT:20}
  public-api-cache:
    # 공개(비개인화) 조회 API 인메모리 마이크로 캐시(PublicApiCacheConfig). 잡과 달리 기본 활성 —
    # 부수효과 없는 읽기 최적화라 조용히 꺼져 있으면 얻는 것 없이 손해만 본다. 이상 시
    # DUING_PUBLIC_API_CACHE_ENABLED=false 로 즉시 끌 수 있다(재기동 필요).
    enabled: ${DUING_PUBLIC_API_CACHE_ENABLED:true}
    # 캐시 수명(ms). 대상 응답이 이미 선언한 Cache-Control: max-age=60 과 같은 값으로 맞춘다 —
    # 브라우저에 허용한 것보다 서버가 더 낡은 값을 주지 않게 하는 상한이다.
    ttl-ms: ${DUING_PUBLIC_API_CACHE_TTL_MS:60000}
    # 캐시별 엔트리 상한. keyword 처럼 값이 무제한인 파라미터가 키에 들어가므로 힙 상한을 명시한다.
    max-entries: ${DUING_PUBLIC_API_CACHE_MAX_ENTRIES:200}
  facility:
    crawler:
      # 시설 예약 크롤 스케줄러(10분)/시설목록 동기화(1일). 로컬/테스트 기본 비활성 —
      # 운영에서 DUING_FACILITY_CRAWLER_ENABLED=true(application-prod.yml)로 활성화한다.
      # 온디맨드 조회(FacilitySchoolClientConfig)는 이 토글과 무관하게 항상 동작한다.
      enabled: ${DUING_FACILITY_CRAWLER_ENABLED:false}
      base-url: ${DUING_FACILITY_BASE_URL:https://www.daegu.ac.kr}
      list-path: /room/detail
      data-path: /room/data/list
      user-agent: ${DUING_FACILITY_USER_AGENT:Mozilla/5.0 (compatible; DuingFacilityBot/1.0)}
      connect-timeout-millis: 3000
      read-timeout-millis: 5000
      retry-max-attempts: 4
      retry-backoff-millis: 500
      # 온디맨드(공개 GET) 예산 — FE 18초 타임아웃(facilityOnDemand) 내 응답: 룸당 총 2회 재시도 +
      # 전체 10초 데드라인. 최악 응답시간 ≈ 16.5s(첫 룸은 데드라인 예외 — 2회 × (3s+5s) + 백오프 0.5s).
      on-demand-retry-max-attempts: 2
      on-demand-deadline-seconds: 10
      room-delay-millis: 100
    booking:
      matching:
        # APPROVED → CONFIRMED 자동 매칭 잡(10분, 크롤 잡과 3분 오프셋). 로컬/테스트 기본 비활성 —
        # 운영에서 DUING_FACILITY_BOOKING_MATCHING_ENABLED=true(application-prod.yml)로 활성화한다.
        enabled: ${DUING_FACILITY_BOOKING_MATCHING_ENABLED:false}
      window:
        # 예약 오픈 구간 정책(설계 §1.5 → 2026-07-16 롤링 전환) — HALF_MONTH: 롤링 창
        # [오늘, 다음 반월 말일]. 오늘 1~pivot일이면 당월 말일까지, (pivot+1)~말일이면 익월 pivot일까지.
        # MONTHLY/FREE 는 키만 예약(미구현 — 선택 시 부팅 실패).
        mode: ${DUING_FACILITY_BOOKING_WINDOW_MODE:HALF_MONTH}
        pivot-day: ${DUING_FACILITY_BOOKING_WINDOW_PIVOT_DAY:15}

# 기본은 안전값(warn). bind 파라미터 로깅(org.hibernate.orm.jdbc.bind=trace)은 이메일·인증코드·학번 등
# PII 를 평문으로 남기므로 base 를 warn 으로 둔다. local 프로파일만 개발 편의로 trace 를 다시 켜고
# (application-local.yml), 운영은 warn(application-prod.yml). 그 외/오설정 프로파일은 base warn 으로 안전하다.
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
