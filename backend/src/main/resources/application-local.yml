spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # 공통 application.yml 의 `classpath:db/migration` 에 더해 로컬 전용 시드 위치를 추가.
    # 운영 프로파일에는 migration-dev 가 포함되지 않으므로 테스트 계정·동아리 시드가 운영 DB 에
    # 흘러 들어가지 않는다. dev 시드(V12~) 는 migration-dev/ 디렉터리에만 둔다.
    locations: classpath:db/migration, classpath:db/migration-dev

file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/duing/uploads}
  local:
    # LocalFileStorageService 가 반환하는 storageKey 의 절대 URL prefix.
    # 비워두면 상대 경로(`/files/...`) 로 폴백 (Next.js dev 에선 동작 안 함).
    base-url: ${FILE_LOCAL_BASE_URL:http://localhost:8080}

# 로컬 개발에서만 SQL/바인드 파라미터를 상세 로깅한다(공통 base 는 warn). bind 는 PII 를 포함하므로 local 전용.
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

duing:
  rate-limit:
    # 로컬은 조회 요청 제한을 끈다 — E2E(Playwright)와 개발 중 새로고침이 전부 127.0.0.1 한 IP 에서 나가 한 창을 쓴다.
    # 로컬에서 동작을 보려면 DUING_RATE_LIMIT_API_READ_PER_MINUTE 를 준다.
    api-read-per-minute: ${DUING_RATE_LIMIT_API_READ_PER_MINUTE:0}
