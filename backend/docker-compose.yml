# 로컬 MinIO 인프라. postgres 는 포함하지 않음 — 기존 개발자 환경(별도 띄움) 존중.
# 실행: docker compose up -d minio minio-setup
# 그 후: SPRING_PROFILES_ACTIVE=local,local-minio ./gradlew bootRun
#
# 이미지 태그는 :latest 금지 — TestcontainersConfiguration 의 postgres:16-alpine 컨벤션 일관.
# L2 통합테스트 (S3FileStorageIntegrationTest) 와 동일 태그 사용.
# minio/mc 는 RELEASE.2025-09-07T16-13-09Z 태그가 Docker Hub 에 없어
# 가장 가까운 안정 태그인 RELEASE.2025-08-13T08-35-41Z 를 사용한다.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 콘솔
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin); do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/duing;
      /usr/bin/mc anonymous set download local/duing;
      exit 0;
      "

volumes:
  minio-data:
